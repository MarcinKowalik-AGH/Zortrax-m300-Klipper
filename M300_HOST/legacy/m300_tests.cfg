# Service/TEST only. Never run automatically. Fluidd category: TEST M300.
[gcode_macro TEST_ZORTRAX_STATUS]
description: TEST / read diagnostics without movement or heating
gcode:
    ZORTRAX_CONFIG_STATUS
    ZORTRAX_HARDWARE_STATUS
    ZORTRAX_OLED_STATUS
    ZORTRAX_FANS_STATUS

[gcode_macro TEST_ZORTRAX_XY]
description: TEST / XY strokes, SPEED=50 mm/s (maximum 60), LOOPS=1..10
gcode:
    {% set speed = params.SPEED|default(50)|float %}
    {% set loops = params.LOOPS|default(1)|int %}
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        {action_raise_error('Run the XY diagnostic with no active or paused print')}
    {% endif %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        {action_raise_error('Home XY before the XY timing test')}
    {% endif %}
    {% if not 0 < speed <= 60 or loops < 1 or loops > 10 %}
        {action_raise_error('XY diagnostic requires SPEED greater than 0 and at most 60 mm/s, and LOOPS=1..10')}
    {% endif %}
    {% set x0 = printer.toolhead.axis_minimum.x + 50 %}
    {% set x1 = printer.toolhead.axis_maximum.x - 50 %}
    {% set y0 = printer.toolhead.axis_minimum.y + 50 %}
    {% set y1 = printer.toolhead.axis_maximum.y - 50 %}
    {% set feed = speed * 60 / printer.gcode_move.speed_factor %}
    SAVE_GCODE_STATE NAME=TEST_ZORTRAX_XY_STATE
    G90
    {% for n in range(loops) %}
        G1 X{x0} Y{y0} F{feed}
        G1 X{x1}
        G1 Y{y1}
        G1 X{x0}
        G1 Y{y0}
        G1 X{x1} Y{y1}
        G1 X{x0} Y{y0}
    {% endfor %}
    M400
    RESTORE_GCODE_STATE NAME=TEST_ZORTRAX_XY_STATE MOVE=0
