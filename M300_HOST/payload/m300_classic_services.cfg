# M300 organized configuration v1
# M300 procedure, geometry, menu and persistent-state settings.

[m300_job]
workflow_qualified: False
homing_mode: require_homed
contact_homing_qualified: False
binary_zcode_qualified: False
platform_soak_seconds: 60
park_x: 300
park_y: 305
home_x: 150
home_y: 158
z_hop: 5
min_park_clearance: 1
travel_speed: 20
z_speed: 1
pause_retract: 2
retract_speed: 2
resume_purge_length: 10
resume_purge_speed: 1
resume_clean_timeout: 600
heat_timeout: 1200
move_timeout: 120
temperature_tolerance: 2
temperature_stable_time: 2
adc_max_age: 1
pause_standby_after: 600
pause_standby_temperature: 150
pause_heater_off_after: 1800
pause_timeout: 3600
park_on_cancel: True
release_motors_on_end: True
filament_pause: False
filament_pause_delay: 1

[m300_filament]
procedure_temperature: 240
filament_qualified: True
load_length: 130
unload_length: 110
change_load_length: 150
segment_length: 5
purge_length: 5
max_purge_length: 20
load_speed: 2
unload_speed: 2
purge_speed: 1
heat_timeout: 1200
confirm_timeout: 600
move_timeout: 60
total_timeout: 2400
temperature_tolerance: 2
temperature_stable_time: 2
standby_after: 300
standby_temperature: 150
max_material_length: 500
use_filament_sensor: False

[m300_nvm]
path: @DATA@/config/m300_settings.json
machine_id: @MACHINE@
mechanics_id: M300_CLASSIC_FACTORY_Z

[m300_sd]
sd_qualified: False
spi_speed: 1000000
request_timeout: 2
import_timeout: 3600
max_file_bytes: 16777216

[m300_maintenance]
qualified: True
service_timeout: 300
max_jog_distance: 1
wake_on_motion: True
wake_on_control: True

[m300_calibration]
approach_distance: 6.0
front_positive_direction: CCW
rear_right_positive_direction: CCW
rear_left_positive_direction: CCW
release_distance: 1
probe_search_margin: 1
safe_z: 5
procedure_temperature: 260
qualified: True
workflow: M07_STOCK
stock_steps_per_mm: 400
max_sample_retries: 2
travel_speed: 100
z_speed: 0.5
probe_speed: 0.5
release_speed: 0.5
min_clearance: 0.5
move_timeout: 120
heat_timeout: 1200
confirm_timeout: 600
total_timeout: 3600
temperature_tolerance: 2
temperature_stable_time: 2
samples: 3
sample_spread: 0.05
max_adjustments: 40

[m300_motion]
mode: native
home_xy: 150,158
home_travel_speed: 50
z_home_hotend_target: 180
z_contact_clearance: 5
z_lift_speed: 5

[m300_menu]

[m300_material_ui]

[m300_menu_ui]
history_depth: 10
scroll_delay: 1.25
scroll_interval: 0.20
row_pixels: 216

[m300_browser]
max_entries: 50

[m300_zcode_policy]
max_source_bytes: 16777216
max_records: 1000000

[m300_settings]

[m300_models]

[m300_print_ui]

[m300_print_control]
park_x: 300
park_y: 305
pause_z_hop: 5
min_park_clearance: 5
pause_standby_after: 600
pause_standby_temperature: 150
pause_heater_off_after: 1800


[bed_mesh]
mesh_min: 0, 0
mesh_max: 300, 305
probe_count: 3, 3
algorithm: lagrange

[m300_pad_mesh]
corner_pad_width: 50
center_pad_width: 50
edge_margin: 16
travel_margin: 1
max_bed_span: 0.8
