[gcode_macro ZORTRAX_BED_MESH]
description: Native 25-point pad mesh; edit pad centers and sizes, PREVIEW=1 shows points without moving
gcode:
    {% if printer.m300_pad_mesh is not defined %}
        {action_raise_error("Enable [bed_mesh] and [m300_pad_mesh] before measuring the pads")}
    {% endif %}
    BED_MESH_CALIBRATE PROFILE={params.PROFILE|default('m300_pads')} CORNER_PAD_WIDTH={params.CORNER_PAD_WIDTH|default(60)} CENTER_PAD_WIDTH={params.CENTER_PAD_WIDTH|default(50)} EDGE_MARGIN={params.EDGE_MARGIN|default(5)} FRONT_RIGHT_X={params.FRONT_RIGHT_X|default(290)} FRONT_RIGHT_Y={params.FRONT_RIGHT_Y|default(30)} FRONT_LEFT_X={params.FRONT_LEFT_X|default(30)} FRONT_LEFT_Y={params.FRONT_LEFT_Y|default(30)} CENTER_X={params.CENTER_X|default(160)} CENTER_Y={params.CENTER_Y|default(160)} REAR_RIGHT_X={params.REAR_RIGHT_X|default(290)} REAR_RIGHT_Y={params.REAR_RIGHT_Y|default(290)} REAR_LEFT_X={params.REAR_LEFT_X|default(30)} REAR_LEFT_Y={params.REAR_LEFT_Y|default(290)} PREVIEW={params.PREVIEW|default(0)}
