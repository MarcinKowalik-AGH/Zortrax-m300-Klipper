# Service/TEST only. Never run automatically. Fluidd category: TEST M300.
[gcode_macro TEST_ZORTRAX_LEVEL]
description: TEST / OEM M07 leveling at 260C; OLED and Fluidd share confirmations
gcode:
    ZORTRAX_PROCEDURE_START OP=LEVEL TEMP={params.TEMP|default(260)|float}

[gcode_macro ZORTRAX_LOAD]
description: TEST / OEM Load material at 240C
gcode:
    ZORTRAX_PROCEDURE_START OP=LOAD TEMP={params.TEMP|default(240)|float}

[gcode_macro ZORTRAX_UNLOAD]
description: TEST / OEM Unload material at 240C
gcode:
    ZORTRAX_PROCEDURE_START OP=UNLOAD TEMP={params.TEMP|default(240)|float}

[gcode_macro TEST_ZORTRAX_STATUS]
description: TEST / read diagnostics without movement or heating
gcode:
    ZORTRAX_CONFIG_STATUS
    ZORTRAX_HARDWARE_STATUS
    ZORTRAX_OLED_STATUS
    ZORTRAX_FANS_STATUS

[gcode_macro TEST_ZORTRAX_XY]
description: TEST / XY strokes, SPEED in mm/s, LOOPS=1..10; no heat or Z/E moves
gcode:
    {% set speed = params.SPEED|default(200)|float %}
    {% set loops = params.LOOPS|default(1)|int %}
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        {action_raise_error('Home XY before the XY timing test')}
    {% endif %}
    {% if not speed > 0 or loops < 1 or loops > 10 %}
        {action_raise_error('Use positive SPEED and LOOPS=1..10')}
    {% endif %}
    {% set x0 = printer.toolhead.axis_minimum.x + 50 %}
    {% set x1 = printer.toolhead.axis_maximum.x - 50 %}
    {% set y0 = printer.toolhead.axis_minimum.y + 50 %}
    {% set y1 = printer.toolhead.axis_maximum.y - 50 %}
    SAVE_GCODE_STATE NAME=TEST_ZORTRAX_XY_STATE
    G90
    {% for n in range(loops) %}
        G1 X{x0} Y{y0} F{speed*60}
        G1 X{x1}
        G1 Y{y1}
        G1 X{x0}
        G1 Y{y0}
        G1 X{x1} Y{y1}
        G1 X{x0} Y{y0}
    {% endfor %}
    M400
    RESTORE_GCODE_STATE NAME=TEST_ZORTRAX_XY_STATE MOVE=0
