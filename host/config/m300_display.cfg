# m300_display.cfg - Ustawia domyślne czasy przygaszenia i uśpienia OLED, kontrast oraz długość zapowiedzi.
# Display only; does not change idle_timeout or printer sleep.
[m300_display]
timeout: 300
sleep_timeout: 900
normal_contrast: 159
dim_contrast: 32
notice_seconds: 10
