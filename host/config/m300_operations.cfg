# Confirmed M300-specific presentation/settings. Fluidd category: ZORTRAX M300.
[m300_settings]

[m300_models]

[m300_print_ui]

[m300_browser]

[m300_sd]

[gcode_macro ZORTRAX_STATUS]
description: M300 hardware, lifecycle and motion status
gcode:
    ZORTRAX_MCU_STATUS
    ZORTRAX_LINK_STATUS
    ZORTRAX_MOTION_STATUS

[gcode_macro ZORTRAX_FANS]
description: Native fan requests and independent MCU cooling status
gcode:
    ZORTRAX_FANS_STATUS

[gcode_macro ZORTRAX_LIGHT]
description: Choose Dynamic, White or Disabled
gcode:
    ZORTRAX_UI_SETTING NAME=light_mode {% if 'MODE' in params %}VALUE={params['MODE']}{% endif %}

[gcode_macro ZORTRAX_SCREEN]
description: OLED display inactivity and wake status
gcode:
    ZORTRAX_DISPLAY_STATUS

[gcode_macro ZORTRAX_LEVEL]
description: OEM Autocalibration at 260C; shared OLED and Fluidd steps
gcode:
    ZORTRAX_PROCEDURE_START OP=LEVEL TEMP={params.TEMP|default(260)|float}

[gcode_macro ZORTRAX_BED_MESH]
description: Automatic heat and native homing, then 25-point pad mesh; HOTEND_TEMP is a minimum, PREVIEW=1 never moves
gcode:
    {% if printer.m300_pad_mesh is not defined %}
        {action_raise_error("Enable [bed_mesh] and [m300_pad_mesh] before measuring the pads")}
    {% endif %}
    BED_MESH_CALIBRATE {% if params.PROFILE is defined %}PROFILE={params.PROFILE}{% endif %} {% if params.PREVIEW is defined %}PREVIEW={params.PREVIEW}{% endif %} {% if params.CORNER_PAD_WIDTH is defined %}CORNER_PAD_WIDTH={params.CORNER_PAD_WIDTH}{% endif %} {% if params.CENTER_PAD_WIDTH is defined %}CENTER_PAD_WIDTH={params.CENTER_PAD_WIDTH}{% endif %} {% if params.EDGE_MARGIN is defined %}EDGE_MARGIN={params.EDGE_MARGIN}{% endif %} {% if params.FRONT_RIGHT_X is defined %}FRONT_RIGHT_X={params.FRONT_RIGHT_X}{% endif %} {% if params.FRONT_RIGHT_Y is defined %}FRONT_RIGHT_Y={params.FRONT_RIGHT_Y}{% endif %} {% if params.FRONT_LEFT_X is defined %}FRONT_LEFT_X={params.FRONT_LEFT_X}{% endif %} {% if params.FRONT_LEFT_Y is defined %}FRONT_LEFT_Y={params.FRONT_LEFT_Y}{% endif %} {% if params.CENTER_X is defined %}CENTER_X={params.CENTER_X}{% endif %} {% if params.CENTER_Y is defined %}CENTER_Y={params.CENTER_Y}{% endif %} {% if params.REAR_RIGHT_X is defined %}REAR_RIGHT_X={params.REAR_RIGHT_X}{% endif %} {% if params.REAR_RIGHT_Y is defined %}REAR_RIGHT_Y={params.REAR_RIGHT_Y}{% endif %} {% if params.REAR_LEFT_X is defined %}REAR_LEFT_X={params.REAR_LEFT_X}{% endif %} {% if params.REAR_LEFT_Y is defined %}REAR_LEFT_Y={params.REAR_LEFT_Y}{% endif %} {% if params.FIT_TRAVEL is defined %}FIT_TRAVEL={params.FIT_TRAVEL}{% endif %} {% if params.TRAVEL_MARGIN is defined %}TRAVEL_MARGIN={params.TRAVEL_MARGIN}{% endif %} {% if params.HOTEND_TEMP is defined %}HOTEND_TEMP={params.HOTEND_TEMP}{% endif %} {% if params.BED_TEMP is defined %}BED_TEMP={params.BED_TEMP}{% endif %}

[gcode_macro ZORTRAX_HEAT]
description: OEM Heat the extruder at 260C; confirm to switch heater off
gcode:
    ZORTRAX_PROCEDURE_START OP=HEAT TEMP={params.TEMP|default(260)|float}

[gcode_macro ZORTRAX_HOME_XY]
description: Home X and Y with shared OLED and Fluidd status
gcode:
    ZORTRAX_PROCEDURE_START OP=HOME_XY

[gcode_macro ZORTRAX_HOME_Z]
description: Home Z after XY with shared OLED and Fluidd status
gcode:
    ZORTRAX_PROCEDURE_START OP=HOME_Z

[gcode_macro ZORTRAX_HOME_ALL]
description: Home X, Y and Z with shared OLED and Fluidd status
gcode:
    ZORTRAX_PROCEDURE_START OP=HOME_ALL

[gcode_macro ZORTRAX_PLATFORM_UP]
description: Move platform toward nozzle; DISTANCE=1 mm, native homed Z required
gcode:
    ZORTRAX_PLATFORM DIRECTION=UP DISTANCE={params.DISTANCE|default(1)|float} {% if 'SPEED' in params %}SPEED={params['SPEED']|float}{% endif %}

[gcode_macro ZORTRAX_PLATFORM_DOWN]
description: Move platform away from nozzle; DISTANCE=1 mm, native homed Z required
gcode:
    ZORTRAX_PLATFORM DIRECTION=DOWN DISTANCE={params.DISTANCE|default(1)|float} {% if 'SPEED' in params %}SPEED={params['SPEED']|float}{% endif %}

[gcode_macro ZORTRAX_LOAD]
description: OEM Load material at 240C
gcode:
    ZORTRAX_PROCEDURE_START OP=LOAD TEMP={params.TEMP|default(240)|float}

[gcode_macro ZORTRAX_UNLOAD]
description: OEM Unload material at 240C
gcode:
    ZORTRAX_PROCEDURE_START OP=UNLOAD TEMP={params.TEMP|default(240)|float}

[gcode_macro ZORTRAX_CHANGE]
description: Change material in a paused native print; Resume remains an operator action
gcode:
    ZORTRAX_PROCEDURE_START OP=CHANGE {% if params.TEMP is defined %}TEMP={params.TEMP|float}{% endif %}

[gcode_macro ZORTRAX_FAN_TEST_START]
description: OEM interactive fan-test menu; preserve automatic upper cooling
gcode:
    ZORTRAX_PROCEDURE_START OP=FANS

[gcode_macro ZORTRAX_FAN_UPPER]
description: Toggle OEM upper fan request between 0 and 150/255
gcode:
    ZORTRAX_PROCEDURE_START OP=FAN_UPPER

[gcode_macro ZORTRAX_FAN_LOWER]
description: Toggle OEM lower fan request between 0 and 150/255
gcode:
    ZORTRAX_PROCEDURE_START OP=FAN_LOWER

[gcode_macro ZORTRAX_FAN_TEST_END]
description: Exit fan test and restore current native policy
gcode:
    ZORTRAX_PROCEDURE_START OP=FAN_BACK

[gcode_macro ZORTRAX_SETTINGS]
description: Shared English Settings menu
gcode:
    ZORTRAX_UI_SHOW PAGE=settings

[gcode_macro ZORTRAX_BUZZER]
description: Enable or disable the existing buzzer
gcode:
    ZORTRAX_UI_SETTING NAME=buzzer {% if 'STATE' in params %}VALUE={params['STATE']}{% endif %}

[gcode_macro ZORTRAX_SLEEP_MODE]
description: Enable or disable existing display sleep; configured timing is preserved
gcode:
    ZORTRAX_UI_SETTING NAME=sleep {% if 'STATE' in params %}VALUE={params['STATE']}{% endif %}

[gcode_macro ZORTRAX_LANGUAGE]
description: English is the only supported interface language
gcode:
    ZORTRAX_UI_SETTING NAME=language

[gcode_macro ZORTRAX_MODELS_SORT]
description: Set DATE, NAME, NAME_CASE or SIZE ordering
gcode:
    ZORTRAX_UI_SETTING NAME=sort {% if 'MODE' in params %}VALUE={params['MODE']}{% endif %}

[gcode_macro ZORTRAX_INFORMATION]
description: Shared Information menu with optional Moonraker history refresh
gcode:
    ZORTRAX_UI_SHOW PAGE=information REFRESH={params['REFRESH']|default(1)|int}

[gcode_macro ZORTRAX_HELP]
description: Project documentation and issues on GitHub
gcode:
    ZORTRAX_MENU_HELP


[gcode_macro CANCEL_PRINT]
description: Cancel native print and heaters
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE

[gcode_macro ZORTRAX_REPRINT]
description: Confirm model removal and reprint the completed snapshot
gcode:
    ZORTRAX_REPRINT_SHOW
