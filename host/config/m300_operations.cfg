# Confirmed M300-specific presentation/settings. Fluidd category: ZORTRAX M300.
[gcode_macro ZORTRAX_STATUS]
description: M300 hardware, lifecycle and motion status
gcode:
    ZORTRAX_MCU_STATUS
    ZORTRAX_LINK_STATUS
    ZORTRAX_MOTION_STATUS

[gcode_macro ZORTRAX_FANS]
description: Native fan requests and independent MCU cooling status
gcode:
    ZORTRAX_FANS_STATUS

[gcode_macro ZORTRAX_LIGHT]
description: OEM light mode; MODE=DYNAMIC, WHITE or DISABLE
gcode:
    ZORTRAX_SETTING NAME=light_mode VALUE={params.MODE|default('DYNAMIC')}

[gcode_macro ZORTRAX_SCREEN]
description: OLED display inactivity and wake status
gcode:
    ZORTRAX_DISPLAY_STATUS

[gcode_macro ZORTRAX_LEVEL]
description: OEM Autocalibration at 260C; shared OLED and Fluidd steps
gcode:
    ZORTRAX_PROCEDURE_START OP=LEVEL TEMP={params.TEMP|default(260)|float}

[gcode_macro ZORTRAX_HEAT]
description: OEM Heat the extruder at 260C; confirm to switch heater off
gcode:
    ZORTRAX_PROCEDURE_START OP=HEAT TEMP={params.TEMP|default(260)|float}

[gcode_macro ZORTRAX_PLATFORM_UP]
description: Move platform toward nozzle; DISTANCE=1 mm, native homed Z required
gcode:
    ZORTRAX_PLATFORM DIRECTION=UP DISTANCE={params.DISTANCE|default(1)|float} SPEED={params.SPEED|default(1)|float}

[gcode_macro ZORTRAX_PLATFORM_DOWN]
description: Move platform away from nozzle; DISTANCE=1 mm, native homed Z required
gcode:
    ZORTRAX_PLATFORM DIRECTION=DOWN DISTANCE={params.DISTANCE|default(1)|float} SPEED={params.SPEED|default(1)|float}

[gcode_macro ZORTRAX_LOAD]
description: OEM Load material at 240C
gcode:
    ZORTRAX_PROCEDURE_START OP=LOAD TEMP={params.TEMP|default(240)|float}

[gcode_macro ZORTRAX_UNLOAD]
description: OEM Unload material at 240C
gcode:
    ZORTRAX_PROCEDURE_START OP=UNLOAD TEMP={params.TEMP|default(240)|float}

[gcode_macro ZORTRAX_CHANGE]
description: Change material in a paused native print; Resume remains an operator action
gcode:
    ZORTRAX_PROCEDURE_START OP=CHANGE {% if params.TEMP is defined %}TEMP={params.TEMP|float}{% endif %}

[gcode_macro ZORTRAX_FAN_TEST_START]
description: OEM interactive fan-test menu; preserve automatic upper cooling
gcode:
    ZORTRAX_PROCEDURE_START OP=FANS

[gcode_macro ZORTRAX_FAN_UPPER]
description: Toggle OEM upper fan request between 0 and 150/255
gcode:
    ZORTRAX_PROCEDURE_START OP=FAN_UPPER

[gcode_macro ZORTRAX_FAN_LOWER]
description: Toggle OEM lower fan request between 0 and 150/255
gcode:
    ZORTRAX_PROCEDURE_START OP=FAN_LOWER

[gcode_macro ZORTRAX_FAN_TEST_END]
description: Exit fan test and restore current native policy
gcode:
    ZORTRAX_PROCEDURE_START OP=FAN_BACK

