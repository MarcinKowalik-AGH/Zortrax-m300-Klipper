# Confirmed M300-specific presentation/settings. Fluidd category: ZORTRAX M300.
[m300_settings]

[m300_models]

[m300_print_ui]

[m300_print_control]
park_x: 300
park_y: 305
pause_z_hop: 5
min_park_clearance: 5
pause_standby_after: 600
pause_standby_temperature: 150
pause_heater_off_after: 1800

[gcode_macro START_PRINT]
description: Concurrent heating, native M300 home, saved mesh and four XY purge lines
gcode:
    {% set hotend = params.EXTRUDER_TEMP|default(printer.extruder.target)|float %}
    {% set bed = params.BED_TEMP|default(printer.heater_bed.target)|float %}
    {% set mesh = params.MESH|default('AUTO') %}
    {% set purge = ' PURGE=' ~ params.PURGE if params.PURGE is defined else '' %}
    ZORTRAX_PRINT_START EXTRUDER_TEMP={hotend} BED_TEMP={bed} MESH={mesh}{purge}

[gcode_macro END_PRINT]
description: Drain moves, safe rear-right park and heaters/print fan off
gcode:
    ZORTRAX_PRINT_END

[m300_browser]

[m300_sd]

[gcode_macro ZORTRAX_STATUS]
description: M300 hardware, lifecycle and motion status
gcode:
    ZORTRAX_MCU_STATUS
    ZORTRAX_LINK_STATUS
    ZORTRAX_MOTION_STATUS

[gcode_macro ZORTRAX_FANS]
description: Native fan requests and independent MCU cooling status
gcode:
    ZORTRAX_FANS_STATUS

[gcode_macro ZORTRAX_LIGHT]
description: Choose Dynamic, White or Disabled
gcode:
    ZORTRAX_UI_SETTING NAME=light_mode {% if 'MODE' in params %}VALUE={params['MODE']}{% endif %}

[gcode_macro ZORTRAX_SCREEN]
description: OLED display inactivity and wake status
gcode:
    ZORTRAX_DISPLAY_STATUS

[gcode_macro ZORTRAX_LEVEL]
description: OEM Autocalibration at 260C; shared OLED and Fluidd steps
gcode:
    ZORTRAX_PROCEDURE_START OP=LEVEL TEMP={params.TEMP|default(260)|float}

[gcode_macro BED_MESH]
description: Automatic heat and native homing, then 25-point pad mesh; HOTEND_TEMP is a minimum, PREVIEW=1 never moves
gcode:
    {% if printer.m300_pad_mesh is not defined %}
        {action_raise_error("Enable [bed_mesh] and [m300_pad_mesh] before measuring the pads")}
    {% endif %}
    {% set _m300_pad_args = [] %}
    {% set _m300_pad_args = _m300_pad_args + ['PROFILE=' ~ params.PROFILE] if params.PROFILE is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['PREVIEW=' ~ params.PREVIEW] if params.PREVIEW is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['CORNER_PAD_WIDTH=' ~ params.CORNER_PAD_WIDTH] if params.CORNER_PAD_WIDTH is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['CENTER_PAD_WIDTH=' ~ params.CENTER_PAD_WIDTH] if params.CENTER_PAD_WIDTH is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['EDGE_MARGIN=' ~ params.EDGE_MARGIN] if params.EDGE_MARGIN is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['FRONT_RIGHT_X=' ~ params.FRONT_RIGHT_X] if params.FRONT_RIGHT_X is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['FRONT_RIGHT_Y=' ~ params.FRONT_RIGHT_Y] if params.FRONT_RIGHT_Y is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['FRONT_LEFT_X=' ~ params.FRONT_LEFT_X] if params.FRONT_LEFT_X is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['FRONT_LEFT_Y=' ~ params.FRONT_LEFT_Y] if params.FRONT_LEFT_Y is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['CENTER_X=' ~ params.CENTER_X] if params.CENTER_X is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['CENTER_Y=' ~ params.CENTER_Y] if params.CENTER_Y is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['REAR_RIGHT_X=' ~ params.REAR_RIGHT_X] if params.REAR_RIGHT_X is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['REAR_RIGHT_Y=' ~ params.REAR_RIGHT_Y] if params.REAR_RIGHT_Y is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['REAR_LEFT_X=' ~ params.REAR_LEFT_X] if params.REAR_LEFT_X is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['REAR_LEFT_Y=' ~ params.REAR_LEFT_Y] if params.REAR_LEFT_Y is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['FIT_TRAVEL=' ~ params.FIT_TRAVEL] if params.FIT_TRAVEL is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['TRAVEL_MARGIN=' ~ params.TRAVEL_MARGIN] if params.TRAVEL_MARGIN is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['HOTEND_TEMP=' ~ params.HOTEND_TEMP] if params.HOTEND_TEMP is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['BED_TEMP=' ~ params.BED_TEMP] if params.BED_TEMP is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['FRONT_RIGHT_BOUNDS=' ~ (params.FRONT_RIGHT_BOUNDS|replace(' ',''))] if params.FRONT_RIGHT_BOUNDS is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['FRONT_LEFT_BOUNDS=' ~ (params.FRONT_LEFT_BOUNDS|replace(' ',''))] if params.FRONT_LEFT_BOUNDS is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['CENTER_BOUNDS=' ~ (params.CENTER_BOUNDS|replace(' ',''))] if params.CENTER_BOUNDS is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['REAR_RIGHT_BOUNDS=' ~ (params.REAR_RIGHT_BOUNDS|replace(' ',''))] if params.REAR_RIGHT_BOUNDS is defined else _m300_pad_args %}
    {% set _m300_pad_args = _m300_pad_args + ['REAR_LEFT_BOUNDS=' ~ (params.REAR_LEFT_BOUNDS|replace(' ',''))] if params.REAR_LEFT_BOUNDS is defined else _m300_pad_args %}
    BED_MESH_CALIBRATE {_m300_pad_args|join(' ')}

[gcode_macro ZORTRAX_HEAT]
description: OEM Heat the extruder at 260C; confirm to switch heater off
gcode:
    ZORTRAX_PROCEDURE_START OP=HEAT TEMP={params.TEMP|default(260)|float}

[gcode_macro ZORTRAX_HEAT_PLATFORM]
description: Heat the platform with shared OLED/Fluidd progress; confirm to turn bed off
gcode:
    ZORTRAX_PROCEDURE_START OP=HEAT_BED TEMP={params.TEMP|default(60)|float}

[gcode_macro ZORTRAX_FULL_PLATFORM_PREHEAT]
description: Enable or disable extra platform stabilization before native printing
gcode:
    ZORTRAX_UI_SETTING NAME=full_platform_preheat {% if 'STATE' in params %}VALUE={params['STATE']}{% endif %}

[gcode_macro ZORTRAX_HOME_X]
description: Home only X with shared OLED and Fluidd status
gcode:
    ZORTRAX_PROCEDURE_START OP=HOME_X

[gcode_macro ZORTRAX_HOME_Y]
description: Home only Y with shared OLED and Fluidd status
gcode:
    ZORTRAX_PROCEDURE_START OP=HOME_Y

[gcode_macro ZORTRAX_HOME_XY]
description: Home X and Y with shared OLED and Fluidd status
gcode:
    ZORTRAX_PROCEDURE_START OP=HOME_XY

[gcode_macro ZORTRAX_HOME_Z]
description: Home Z after XY with shared OLED and Fluidd status
gcode:
    ZORTRAX_PROCEDURE_START OP=HOME_Z

[gcode_macro ZORTRAX_HOME_ALL]
description: Home X, Y and Z with shared OLED and Fluidd status
gcode:
    ZORTRAX_PROCEDURE_START OP=HOME_ALL

[gcode_macro ZORTRAX_PLATFORM_UP]
description: Move platform toward nozzle; DISTANCE=1 mm, native homed Z required
gcode:
    ZORTRAX_PLATFORM DIRECTION=UP DISTANCE={params.DISTANCE|default(1)|float} {% if 'SPEED' in params %}SPEED={params['SPEED']|float}{% endif %}

[gcode_macro ZORTRAX_PLATFORM_DOWN]
description: Move platform away from nozzle; DISTANCE=1 mm, native homed Z required
gcode:
    ZORTRAX_PLATFORM DIRECTION=DOWN DISTANCE={params.DISTANCE|default(1)|float} {% if 'SPEED' in params %}SPEED={params['SPEED']|float}{% endif %}

[gcode_macro ZORTRAX_LOAD]
description: OEM Load material at 240C
gcode:
    ZORTRAX_PROCEDURE_START OP=LOAD TEMP={params.TEMP|default(240)|float}

[gcode_macro ZORTRAX_UNLOAD]
description: OEM Unload material at 240C
gcode:
    ZORTRAX_PROCEDURE_START OP=UNLOAD TEMP={params.TEMP|default(240)|float}

[gcode_macro ZORTRAX_CHANGE]
description: Change material in a paused native print; Resume remains an operator action
gcode:
    ZORTRAX_PROCEDURE_START OP=CHANGE {% if params.TEMP is defined %}TEMP={params.TEMP|float}{% endif %}

[gcode_macro ZORTRAX_FAN_TEST_START]
description: OEM interactive fan-test menu; preserve automatic upper cooling
gcode:
    ZORTRAX_PROCEDURE_START OP=FANS

[gcode_macro ZORTRAX_FAN_UPPER]
description: Toggle OEM upper fan request between 0 and 150/255
gcode:
    ZORTRAX_PROCEDURE_START OP=FAN_UPPER

[gcode_macro ZORTRAX_FAN_LOWER]
description: Toggle OEM lower fan request between 0 and 150/255
gcode:
    ZORTRAX_PROCEDURE_START OP=FAN_LOWER

[gcode_macro ZORTRAX_FAN_TEST_END]
description: Exit fan test and restore current native policy
gcode:
    ZORTRAX_PROCEDURE_START OP=FAN_BACK

[gcode_macro ZORTRAX_SETTINGS]
description: Shared English Settings menu
gcode:
    ZORTRAX_UI_SHOW PAGE=settings

[gcode_macro ZORTRAX_BUZZER]
description: Enable or disable the existing buzzer
gcode:
    ZORTRAX_UI_SETTING NAME=buzzer {% if 'STATE' in params %}VALUE={params['STATE']}{% endif %}

[gcode_macro ZORTRAX_SLEEP_MODE]
description: Enable or disable existing display sleep; configured timing is preserved
gcode:
    ZORTRAX_UI_SETTING NAME=sleep {% if 'STATE' in params %}VALUE={params['STATE']}{% endif %}

[gcode_macro ZORTRAX_LANGUAGE]
description: English is the only supported interface language
gcode:
    ZORTRAX_UI_SETTING NAME=language

[gcode_macro ZORTRAX_MODELS_SORT]
description: Set DATE, NAME, NAME_CASE or SIZE ordering
gcode:
    ZORTRAX_UI_SETTING NAME=sort {% if 'MODE' in params %}VALUE={params['MODE']}{% endif %}

[gcode_macro ZORTRAX_INFORMATION]
description: Shared Information menu with optional Moonraker history refresh
gcode:
    ZORTRAX_UI_SHOW PAGE=information REFRESH={params['REFRESH']|default(1)|int}

[gcode_macro ZORTRAX_HELP]
description: Project documentation and issues on GitHub
gcode:
    ZORTRAX_MENU_HELP


[gcode_macro CANCEL_PRINT]
description: Cancel native print and heaters
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE

[gcode_macro ZORTRAX_REPRINT]
description: Confirm model removal and reprint the completed snapshot
gcode:
    ZORTRAX_REPRINT_SHOW
