# Optional STM32F103 internal temperature diagnostics, MCU >= 1.0.9.
# Enable in printer.cfg: [include m300_mcu_temperature.cfg]
# Disable: # [include m300_mcu_temperature.cfg]
# Console: M300_MCU_TEMPERATURE
# Moonraker object: m300_mcu_temperature.
# The main include enables this reading and the MCU graph together.
# Set show_on_graph: False only for diagnostic-only operation.

[m300_mcu_temperature]
report_time: 5
adc_voltage: 3.3
temperature_offset: 0
show_on_graph: True
