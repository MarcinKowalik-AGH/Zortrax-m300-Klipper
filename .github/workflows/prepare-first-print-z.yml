name: Prepare first-print Z correction sources
on:
  push:
    branches: [fix/first-print-qualified-z-20261111]
    paths: ['.github/workflows/prepare-first-print-z.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/first-print-qualified-z-20261111
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the exact reviewed patch to its exact source baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=$(gh api repos/MarcinKowalik-AGH/Zortrax-m300-Klipper/git/blobs/a29fe663448c4f6fd405f5884c9938b5cd28d435 --jq .content | base64 --decode)
          echo "::add-mask::$url"
          curl --fail --silent --show-error --location --retry 2 "$url" -o "$RUNNER_TEMP/first-print.zip"
          echo '8c0409df2a5413ac69431fd7e09a2d994f6d51a545a87abae62539d8f166b9b5  '"$RUNNER_TEMP/first-print.zip" | sha256sum -c -
          python - <<'PY'
          import hashlib,json,os,stat,subprocess,zipfile
          from pathlib import Path
          base='b8f76f0839508858462af234007e76b78d7e6293'
          assert subprocess.check_output(['git','diff','--name-only',base],text=True).splitlines()==['.github/workflows/prepare-first-print-z.yml']
          root=Path.cwd().resolve()
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'first-print.zip') as z:
              assert len(z.infolist())==26
              assert sum(i.file_size for i in z.infolist())<2000000
              manifest=json.loads(z.read('manifest.json'))
              assert manifest['base_commit']==base and len(manifest['files'])==25
              assert manifest['runtime_changes']==['host/klippy/extras/m300_native_motion.py']
              assert set(z.namelist())=={'manifest.json'}|{'payload/'+p for p in manifest['files']}
              pending={}
              for name,checks in manifest['files'].items():
                  p=Path(name);target=root/p
                  assert not p.is_absolute() and '..' not in p.parts
                  assert name in ('PORT.json','README.md','README_PL.md','host/klippy/extras/m300_native_motion.py') or name.startswith(('ci/','docs/','host/update_template/'))
                  assert not target.is_symlink() and target.resolve().is_relative_to(root)
                  before=hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None
                  assert before==checks['before'],name
                  info=z.getinfo('payload/'+name)
                  assert not stat.S_ISLNK(info.external_attr>>16)
                  data=z.read(info)
                  assert hashlib.sha256(data).hexdigest()==checks['after'],name
                  pending[target]=data
              for target,data in pending.items():
                  target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          print('Applied 25 checksum-verified files; only native homing changed at runtime.')
          PY
      - name: Verify host regression, installer guards, source report and documentation
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow==11.3.0 Jinja2==3.1.6
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'ci')
          from project import stage_host_update
          stage_host_update(Path('.ci/first-print-test'))
          PY
          (cd .ci/first-print-test && python -m unittest discover -s tests -v) > "$RUNNER_TEMP/host-tests.log" 2>&1 || { cat "$RUNNER_TEMP/host-tests.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/host-tests.log"
          grep -q 'Ran 794 tests' "$RUNNER_TEMP/host-tests.log"
          python ci/test_install_orange_pi.py
          python ci/test_acceptance_register.py
          python ci/test_release23_contracts.py
          python ci/acceptance_register.py --check
          python docs/tools/check_manual.py
          git diff --check
      - name: Commit the verified fix on its isolated branch, without workflow changes
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only b8f76f0839508858462af234007e76b78d7e6293 -- mcu frontend host/config)"
          git add PORT.json README.md README_PL.md ci docs host
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement opt-in qualified first-print Z geometry and effective 2 mm PC7 clearance with 794 host tests'
          git push origin HEAD:fix/first-print-qualified-z-20261111
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M300_FIRST_PRINT_Z_PRECHECK
          path: |
            ${{ runner.temp }}/host-tests.log
            .ci/reports/DOCUMENTATION_BETA24_VALIDATION.json
          if-no-files-found: warn
