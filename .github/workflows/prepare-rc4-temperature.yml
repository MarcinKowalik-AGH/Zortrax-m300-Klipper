name: Prepare RC4 OLED temperature editors
on:
  push:
    branches: [feat/rc4-oled-temperature-editors]
    paths: ['.github/workflows/prepare-rc4-temperature.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rc4-oled-temperature-editors
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the checksum-pinned reviewed UI patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git diff --name-only 247aab33c789c9879a22a9f94eb4327a869d2bae)" = '.github/workflows/prepare-rc4-temperature.yml'
          url=$(gh api repos/MarcinKowalik-AGH/Zortrax-m300-Klipper/git/blobs/fcf29a2626749f0c0a3cd0c450d649cc0e524ed9 --jq .content | base64 --decode)
          echo "::add-mask::$url"
          curl --fail --silent --show-error --location --retry 2 "$url" -o "$RUNNER_TEMP/rc4.patch"
          echo '00315a60905706a0c60fdb2b69855a651acd321d0e2df0ffa7cfda5170a4110f  '"$RUNNER_TEMP/rc4.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/rc4.patch"
          git apply --index "$RUNNER_TEMP/rc4.patch"
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==37, paths
          assert not subprocess.check_output(['git','diff','--cached','--','mcu','frontend','host/config','.github/workflows'],text=True)
          for path in paths:
              assert path in ('PORT.json','README.md','README_PL.md') or path.startswith(('ci/','docs/','host/klippy/extras/','host/update_template/')),path
          PY
      - name: Test exact native pixels, acknowledged draft selection and release contracts
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow==11.3.0 Jinja2==3.1.6
          python ci/render_temperature_editors.py --check
          (cd .ci/temperature-editor-render && python -m unittest discover -s tests -v)
          python ci/test_install_orange_pi.py
          python ci/test_fluidd_selection.py
          python ci/test_rc1_contracts.py
          python ci/test_release23_contracts.py
          python docs/tools/check_manual.py --output .ci/reports/RC4_DOCUMENTATION.json
          git diff --cached --check
      - name: Commit reviewed implementation without changing workflow permissions
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'RC4: native OLED temperature bar editors, exact draft acknowledgement and unchanged heater ownership'
          git push origin HEAD:feat/rc4-oled-temperature-editors
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M300_RC4_TEMPERATURE_EDITOR_PREPARATION
          path: .ci/reports/RC4_DOCUMENTATION.json
          if-no-files-found: warn
          retention-days: 14
