name: M300 R3 thermal and PA audit
on:
  push:
    branches: ['feature/m300-microswiss-thermal-pa-r3']
    paths: ['tools/apply_m300_r3.py', 'host/update_template/tests/test_temperature_policy_r3.py', 'orca/tests/audit_r3.py', '.github/workflows/m300-r3-thermal-pa.yml']
permissions:
  contents: read
concurrency:
  group: m300-r3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply explicit R3 source edits and stage host package
        run: |
          python tools/apply_m300_r3.py
          PYTHONPATH=ci python - <<'PY'
          from project import ROOT,stage_host_update
          stage_host_update(ROOT/'.ci/r3-host')
          PY
          python -m pip install jinja2 pillow
          mkdir -p dist/r3
      - name: Validate host and installer regression
        run: |
          cd .ci/r3-host
          python VERIFY.py
          python -m unittest discover -s tests -v > ../../dist/r3/host-tests.log 2>&1
          tail -5 ../../dist/r3/host-tests.log
          grep -q 'Ran 756 tests' ../../dist/r3/host-tests.log
      - name: Prepare real OrcaSlicer 2.3.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0t64 libwebkit2gtk-4.1-0 libglu1-mesa libsecret-1-0 libgstreamer1.0-0 libgl1-mesa-dri
          mkdir -p "$RUNNER_TEMP/orca"
          cd "$RUNNER_TEMP/orca"
          curl --fail --location --retry 3 -o Orca.AppImage 'https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.3.2/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.3.2.AppImage'
          echo 'c64336ceec37d941766e675cbaaaf5124e184402bf18177fbf81ba5102734ad8  Orca.AppImage' | sha256sum -c -
          chmod +x Orca.AppImage
          ./Orca.AppImage --appimage-extract > /dev/null
      - name: Slice all materials and verify per-filament Pressure Advance
        run: |
          xvfb-run -a python orca/tests/audit_r3.py \
            --orca "$RUNNER_TEMP/orca/squashfs-root/AppRun" \
            --bundle orca/Zortrax_M300_Classic_0p20_18_filaments.orca_printer \
            --out "$RUNNER_TEMP/r3-slice"
      - name: Package and publish only the validated draft changes
        env:
          TARGET_BRANCH: feature/m300-microswiss-thermal-pa-r3
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path
          source=Path(os.environ['RUNNER_TEMP'])/'r3-slice'
          summary=json.loads((source/'summary.json').read_text())
          assert summary['material_pass']==17 and summary['material_fail']==0 and summary['pa_propagation_test']=='PASS'
          bundle=Path('orca/Zortrax_M300_Classic_0p20_18_filaments.orca_printer')
          assert hashlib.sha256(bundle.read_bytes()).hexdigest()==summary['bundle_sha256']
          summary.update(tested_commit=os.environ['GITHUB_SHA'],workflow_run_id=os.environ['GITHUB_RUN_ID'])
          Path('orca/VALIDATION_RESULTS.json').write_text(json.dumps(summary,indent=2)+'\n')
          shutil.copyfile(source/'results.json','orca/ORCA_RUNTIME_RESULTS_R3.json')
          readme=Path('orca/README.md')
          notice='> R3: bed target <=105C; current hotend safety limit unchanged; M83 retained; per-filament PA is explicit zero pending measurement. See [Micro Swiss R3](MICROSWISS_R3_PL.md). This is not a physical calibration.\n\n'
          if not readme.read_text().startswith(notice):readme.write_text(notice+readme.read_text())
          out=Path('dist/r3')
          shutil.copyfile(bundle,out/'Zortrax_M300_Classic_0p20_MicroSwiss_R3.orca_printer')
          shutil.copyfile('orca/MICROSWISS_R3_PL.md',out/'MICROSWISS_R3_PL.md')
          shutil.copyfile('orca/VALIDATION_RESULTS.json',out/'VALIDATION_RESULTS.json')
          shutil.copyfile(source/'results.json',out/'ORCA_RUNTIME_RESULTS_R3.json')
          host=Path('.ci/r3-host')
          with zipfile.ZipFile(out/'M300_HOST_R3_TEMPERATURE_PA.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in host.rglob('*'):
                  if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc':z.write(p,p.relative_to(host))
          (out/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.is_file() and p.name!='SHA256SUMS'))
          PY
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add host PORT.json orca/Zortrax_M300_Classic_0p20_18_filaments.orca_printer orca/VALIDATION_RESULTS.json orca/ORCA_RUNTIME_RESULTS_R3.json orca/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish tested R3 bed target105 enforcement and measured-PA-ready Orca profile'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - name: Keep evidence and installable host package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M300_R3_THERMAL_PA
          path: |
            dist/r3
            ${{ runner.temp }}/r3-slice
          retention-days: 14
