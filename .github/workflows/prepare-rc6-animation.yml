name: Prepare RC6 animation repair
on:
  push:
    branches: [fix/rc6-approved-menu-animation]
    paths: ['.github/workflows/prepare-rc6-animation.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc6-approved-menu-animation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the exact reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git diff --name-only 287fcddea4e6e966239a70407c7f8438a8502eed)" = '.github/workflows/prepare-rc6-animation.yml'
          url=$(gh api repos/MarcinKowalik-AGH/Zortrax-m300-Klipper/git/blobs/94adfb0eead12aea8e1f03cca782c7eedc74daad --jq .content | base64 --decode)
          echo "::add-mask::$url"
          curl --fail --silent --show-error --location --retry 2 "$url" -o "$RUNNER_TEMP/animation.patch"
          echo 'acc352b67d077e6c3a287e5e1533fabfcd410eb30d70366ced8817a31d4b0f08  '"$RUNNER_TEMP/animation.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/animation.patch"
          git apply --index "$RUNNER_TEMP/animation.patch"
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths)==30,paths
          for path in paths:
              assert path in ('PORT.json','README.md','README_PL.md') or path.startswith(('ci/','docs/','host/')),path
          assert not subprocess.check_output(['git','diff','--cached','--','mcu','frontend','host/config'],text=True)
          PY
          cp .git/index "$RUNNER_TEMP/approved.index"
          GIT_INDEX_FILE="$RUNNER_TEMP/approved.index" git update-index --force-remove .github/workflows/prepare-rc6-animation.yml
          actual=$(GIT_INDEX_FILE="$RUNNER_TEMP/approved.index" git write-tree)
          echo "Reviewed complete source tree: $actual"
          test "$actual" = d225e97fa884145a9f81125a6d4af7061e2f57ea
      - name: Run full host regressions and unchanged-pixel animation checks
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow==11.3.0 Jinja2==3.1.6
          PYTHONPATH=ci python - <<'PY'
          from project import ROOT,stage_host_update
          stage_host_update(ROOT/'.ci/animation-host')
          PY
          (cd .ci/animation-host && python -m unittest discover -s tests)
          python ci/check_menu_animation.py --check
          python ci/render_temperature_editors.py --check
          python ci/test_rc1_contracts.py
          python ci/test_release23_contracts.py
          python docs/tools/check_manual.py --output .ci/reports/DOCUMENTATION_RC6_VALIDATION.json
          git diff --cached --check
      - name: Commit verified changes on the isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'RC6: restore approved menu animation without changing icon shading or heater behavior'
          git push origin HEAD:fix/rc6-approved-menu-animation
