name: Publish verified M300 MCU

on:
  workflow_run:
    workflows: ['M300 build and verification']
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: m300-mcu-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish firmware-only ZIP from the successful signed-off build
        run: bash ci/publish_mcu_release.sh
