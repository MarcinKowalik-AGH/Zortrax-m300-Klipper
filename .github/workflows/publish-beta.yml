name: Publish versioned M300 beta

on:
  workflow_run:
    workflows: ['M300 R16.12 full Orange Pi build']
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: m300-versioned-beta-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish one immutable prerelease from the successful build
        run: bash ci/publish_beta_release.sh
