name: Retry recognized transient M300 failures

on:
  workflow_run:
    workflows: ['M300 R16.12 full Orange Pi build', 'Publish versioned M300 beta']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: m300-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  classify:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Checkout trusted retry policy only
        uses: actions/checkout@v4
        with:
          # workflow_run github.sha is trusted DEFAULT-BRANCH code, not PR code.
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            ci/retry_failed_workflow.py
          sparse-checkout-cone-mode: false
      - name: Classify and conditionally rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/retry_failed_workflow.py --apply
      - name: Preserve bounded retry decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m300-retry-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: .ci/reports/CI_RETRY_DECISION.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
