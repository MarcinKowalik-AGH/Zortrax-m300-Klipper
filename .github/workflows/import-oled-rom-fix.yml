name: Optimize toned OLED ROM
on:
  push:
    branches: [feat/beta21-toned-oled]
    paths: ['.github/workflows/import-oled-rom-fix.yml']
permissions:
  contents: read
jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beta21-toned-oled
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checksum-pinned lossless ROM fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=$(gh api repos/MarcinKowalik-AGH/Zortrax-m300-Klipper/git/blobs/802f13269d1e24b4c5dab5e60b52c28e8b6a5380 --jq .content | base64 --decode)
          echo "::add-mask::$url"
          curl --fail --silent --show-error --location --retry 2 "$url" -o "$RUNNER_TEMP/fix.zip"
          echo '8c7b426205af175d922a439cd99b7d3a947d63cb0d65e3e9c83cf7fa5be094e4  '"$RUNNER_TEMP/fix.zip" | sha256sum -c -
          python - <<'PY'
          import hashlib,json,os,stat,subprocess,zipfile
          from pathlib import Path
          root=Path.cwd().resolve()
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'fix.zip') as z:
              m=json.loads(z.read('_PATCH_MANIFEST.json'))
              assert m['base_commit']=='f152caecf149a522daf11fc9b153537cd7f7dca0'
              subprocess.run(['git','merge-base','--is-ancestor',m['base_commit'],'HEAD'],check=True)
              assert len(m['files'])==9 and set(z.namelist())==set(m['files'])|{'_PATCH_MANIFEST.json'}
              assert sum(i.file_size for i in z.infolist())<400000
              pending=[]
              for name,h in m['files'].items():
                  p=Path(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert name.startswith(('ci/','docs/','mcu/SOURCE_MCU/'))
                  assert not stat.S_ISLNK(z.getinfo(name).external_attr>>16)
                  target=root/p
                  assert target.resolve().is_relative_to(root) and not target.is_symlink()
                  assert hashlib.sha256(target.read_bytes()).hexdigest()==h['before'],name
                  data=z.read(name)
                  assert hashlib.sha256(data).hexdigest()==h['after'],name
                  pending.append((target,data))
              for target,data in pending:target.write_bytes(data)
          PY
      - name: Validate exact pixel values and native C blitter
        run: |
          python ci/generate_error_catalog.py --check
          python ci/check_ui_symbols.py -v
          python ci/check_toned_activity.py
          cc -std=c11 -O2 -Wall -Wextra -Werror mcu/SOURCE_MCU/tests/test_panel.c -o "$RUNNER_TEMP/panel-test"
          "$RUNNER_TEMP/panel-test"
          git diff --check
      - name: Commit optimized data and remove importer
        run: |
          set -euo pipefail
          rm .github/workflows/import-oled-rom-fix.yml
          git add ci docs mcu/SOURCE_MCU .github/workflows/import-oled-rom-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Compress deduplicated MCU rows losslessly, saving 6113 ROM bytes without changing a pixel'
          git push origin HEAD:feat/beta21-toned-oled
