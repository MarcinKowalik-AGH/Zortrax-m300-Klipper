name: Prepare M300 toned OLED source
on:
  push:
    branches: [feat/beta21-toned-oled]
    paths: ['.github/workflows/prepare-toned-oled.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Snapshot the exact source baseline
        run: |
          git archive --format=zip HEAD > "$RUNNER_TEMP/M300_BETA21_SOURCE_BASELINE.zip"
          sha256sum "$RUNNER_TEMP/M300_BETA21_SOURCE_BASELINE.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: M300_BETA21_SOURCE_BASELINE
          path: ${{ runner.temp }}/M300_BETA21_SOURCE_BASELINE.zip
          retention-days: 2
