name: Finalize RC5 review metadata
on:
  push:
    branches: [fix/rc5-oled-apply-heater-target]
    paths: ['.github/workflows/prepare-rc5-target.yml']
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc5-oled-apply-heater-target
          fetch-depth: 0
      - name: Align report with the completed 855-test preparation
        run: |
          set -euo pipefail
          test "$(git diff --name-only b2d0427146c29f8d8311bd31137240e6da8dca38)" = '.github/workflows/prepare-rc5-target.yml'
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          report_path=Path('docs/reports/RC5_REVIEW.json')
          report=json.loads(report_path.read_text())
          assert report['release']=='v1.0.0-rc.5'
          report['host_tests_result']='855 PASS'
          report['changed_oled_methods']=[]
          report['oled_runtime_unchanged_from']='e27a553278a7428a2d2ddf6db80293cb2bfa4bdc'
          report.pop('unchanged_oled_methods',None)
          path='host/klippy/extras/m300_oled.py'
          previous=subprocess.check_output(['git','show','e27a553278a7428a2d2ddf6db80293cb2bfa4bdc:'+path])
          assert Path(path).read_bytes()==previous
          report['protected_sha256'][path]=hashlib.sha256(previous).hexdigest()
          report['preparation_run']=43445851581
          for name,expected in report['protected_sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          report_path.write_text(json.dumps(report,indent=2)+'\n')
          manifest_path=Path('docs/reports/DOCUMENTATION_FILES.json')
          manifest=json.loads(manifest_path.read_text())
          manifest['files'][str(report_path)]=hashlib.sha256(report_path.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n')
          assert not subprocess.check_output(['git','diff','--','host','mcu','frontend'],text=True)
          PY
          git add docs/reports/RC5_REVIEW.json docs/reports/DOCUMENTATION_FILES.json
          git rm .github/workflows/prepare-rc5-target.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize RC5 evidence for 855 tests and unchanged OLED transport; remove temporary workflow'
          git push origin HEAD:fix/rc5-oled-apply-heater-target
