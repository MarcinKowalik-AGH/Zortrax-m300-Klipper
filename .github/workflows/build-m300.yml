name: M300 R16.12 full Orange Pi build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-m300.yml'
      - 'PORT.json'
      - 'ci/**'
      - 'mcu/**'
      - 'host/**'
      - 'frontend/**'
      - 'tests/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m300-arm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify MCU, host and Fluidd
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout M300 sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GNU ARM and native test compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libffi-dev
          arm-none-eabi-gcc --version
          test -f "$(arm-none-eabi-gcc --print-file-name=libc_nano.a)"

      - name: Fetch checksum-pinned upstream Klipper
        run: python ci/prepare_upstream.py

      - name: Install pinned native Klippy test dependencies
        run: python -m pip install -r .ci/pristine/scripts/klippy-requirements.txt

      - name: Fresh complete STM32F103 build
        shell: bash
        run: |
          set -euo pipefail
          python mcu/SOURCE_MCU/tools/build.py --archive mcu/SOURCE_MCU/UPSTREAM_KLIPPER_PINNED.zip --work .ci/arm-build --output dist/mcu --jobs 4

      - name: Validate host, startup, guards, cooling and actual Klippy FILEOUTPUT
        run: python ci/run_checks.py --dictionary dist/mcu/klipper.dict

      - name: Select Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Build and test the Fluidd diagram
        run: bash ci/build_fluidd.sh

      - name: Assemble the complete Orange Pi artifact
        shell: bash
        run: |
          set -euo pipefail
          python ci/package_release.py --build dist/mcu --fluidd dist/fluidd
          cd dist/release
          sha256sum -c SHA256SUMS

      - name: Upload the ready-to-install package
        uses: actions/upload-artifact@v4
        with:
          name: M300_R16_12_FULL_ORANGE_PI
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve diagnostics when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m300-failed-build-diagnostics-${{ github.sha }}
          path: |
            .ci/reports/
            .ci/fileoutput/
            dist/mcu/FULL_ARM_BUILD.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  deploy-git:
    name: Publish ready Orange Pi files over Git
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve the verified build
        uses: actions/download-artifact@v4
        with:
          name: M300_R16_12_FULL_ORANGE_PI
          path: dist/action-release

      - name: Publish the compact Git deployment
        run: bash ci/publish_git_deploy.sh dist/action-release
