name: M300 build and verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'PORT.json'
      - 'ci/**'
      - 'mcu/**'
      - 'host/**'
      - 'frontend/**'
      - 'tests/**'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m300-arm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify MCU, host and Fluidd
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout M300 sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate port selection, retry policy and hardware ledger
        run: |
          python ci/test_fluidd_selection.py
          python ci/test_retry_failed_workflow.py
          python ci/test_acceptance_register.py
          python ci/test_release23_contracts.py
          python ci/test_rc1_contracts.py
          python ci/acceptance_register.py --check

      - name: Install GNU ARM and native test compiler
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # The Azure archive can trickle large ARM packages until the step
          # times out. Keep Ubuntu's signed packages, using its main archive.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends build-essential gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libffi-dev
          arm-none-eabi-gcc --version
          test -f "$(arm-none-eabi-gcc --print-file-name=libc_nano.a)"

      - name: Fetch checksum-pinned upstream Klipper
        run: python ci/prepare_upstream.py

      - name: Install pinned native Klippy and raster test dependencies
        run: |
          python -m pip install -r .ci/pristine/scripts/klippy-requirements.txt
          python -m pip install Pillow==11.3.0

      - name: Fresh complete STM32F103 build
        shell: bash
        run: |
          set -euo pipefail
          python mcu/SOURCE_MCU/tools/build.py --archive mcu/SOURCE_MCU/UPSTREAM_KLIPPER_PINNED.zip --work .ci/arm-build --output dist/mcu --jobs 4

      - name: Verify the compiled numeric MCU identity and signed application bounds
        run: python ci/test_mcu_version.py --dictionary dist/mcu/klipper.dict --binary dist/mcu/klipper.bin

      - name: Validate host, startup, guards, cooling and actual Klippy FILEOUTPUT
        run: python ci/run_checks.py --dictionary dist/mcu/klipper.dict

      - name: Verify event-driven OLED navigation on the pinned Klipper reactor
        run: python ci/check_oled_navigation.py --klipper .ci/pristine --output .ci/reports/OLED_NAVIGATION.json

      - name: Check OLED RLE on emulated Cortex-M instructions
        run: |
          python -m pip install unicorn==2.1.4
          python ci/benchmark_oled_rle.py --output .ci/reports/OLED_RLE.json

      - name: Select Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Build and test the Fluidd diagram
        run: bash ci/build_fluidd.sh

      - name: Validate current instructions and historical OLED illustrations
        run: python docs/tools/check_manual.py --output .ci/reports/DOCUMENTATION_RC1_VALIDATION.json

      - name: Assemble the complete Orange Pi artifact
        shell: bash
        run: |
          set -euo pipefail
          python ci/package_release.py --build dist/mcu --fluidd dist/fluidd
          cd dist/release
          sha256sum -c SHA256SUMS

      - name: Upload the ready-to-install package
        uses: actions/upload-artifact@v4
        with:
          name: M300_ORANGE_PI
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Preserve diagnostics when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m300-failed-build-diagnostics-${{ github.sha }}
          path: |
            .ci/reports/
            .ci/fileoutput/
            dist/mcu/FULL_ARM_BUILD.log
            dist/mcu/klipper.dict
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  deploy-git:
    name: Publish ready Orange Pi files over Git
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve the verified build
        uses: actions/download-artifact@v4
        with:
          name: M300_ORANGE_PI
          path: dist/action-release

      - name: Publish the compact Git deployment
        run: bash ci/publish_git_deploy.sh dist/action-release
