name: Import and verify the complete M300 manual
on:
  push:
    branches: [docs/manual-20261110]
    paths: ['.github/workflows/import-manual-20261110.yml']
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/manual-20261110
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve checksum-pinned documentation only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          url=$(gh api repos/MarcinKowalik-AGH/Zortrax-m300-Klipper/git/blobs/5ee51dfcb2d09589ccfa5a37875a5128c7dbec75 --jq .content | base64 --decode)
          echo "::add-mask::$url"
          curl --fail --silent --show-error --location --retry 2 "$url" -o "$RUNNER_TEMP/manual.zip"
          echo '790e0c60a61cc4b5f07d0af320087434f433e5a793e3e1ca6912e50d4040f3e8  '"$RUNNER_TEMP/manual.zip" | sha256sum -c -
          python - <<'PY'
          import hashlib,json,os,stat,zipfile
          from pathlib import Path
          root=Path.cwd().resolve()
          archive=Path(os.environ['RUNNER_TEMP'])/'manual.zip'
          with zipfile.ZipFile(archive) as z:
              assert len(z.infolist()) == 106
              assert sum(x.file_size for x in z.infolist()) < 20000000
              for info in z.infolist():
                  p=Path(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert info.filename=='README_PL.md' or info.filename.startswith(('docs/pl/','docs/img/','docs/reports/','docs/tools/'))
                  assert not stat.S_ISLNK(info.external_attr >> 16)
                  target=root/p
                  assert target.resolve().is_relative_to(root)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(info.filename))
          manifest=json.loads((root/'docs/reports/DOCUMENTATION_FILES.json').read_text())
          for name,expected in manifest['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected,name
          readme=root/'README.md'
          text=readme.read_text()
          assert text.startswith('# Zortrax M300 Classic')
          text=text.replace('v1.0.0-beta.16','v1.0.0-beta.17',3)
          title,separator,body=text.partition('\n\n')
          readme.write_text(title+'\n\n> **Complete illustrated Polish manual:** [start here](README_PL.md) · [OLED menu and 43 rendered screens](docs/pl/OLED_MENU_REFERENCE.md) · [technical reference](docs/pl/TECHNICAL_REFERENCE.md) · [documentation verification](docs/pl/DOCUMENTATION_CHECK.md). Documentation baseline: beta.17; runtime code is unchanged.\n\n'+body)
          print('Imported 106 documentation files; original screenshot bytes verified.')
          PY
      - name: Verify links, all macros, screenshots and exact OLED pixels
        run: |
          python -m pip install --quiet Pillow==11.3.0 Jinja2==3.1.6
          python docs/tools/check_manual.py
      - name: Reproduce OLED renders from the pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          cp docs/reports/OLED_RENDER_MANIFEST.json "$RUNNER_TEMP/oled-before.json"
          python ci/prepare_upstream.py
          python docs/tools/render_oled_manual.py --klipper .ci/pristine
          python - <<'PY'
          import json,os
          from pathlib import Path
          before=json.loads((Path(os.environ['RUNNER_TEMP'])/'oled-before.json').read_text())
          after=json.loads(Path('docs/reports/OLED_RENDER_MANIFEST.json').read_text())
          assert before['menu_rows']==after['menu_rows']
          assert {s['id']:s['wire_sha256'] for s in before['screens']}=={s['id']:s['wire_sha256'] for s in after['screens']}
          print('All 43 native OLED frame hashes and menu rows reproduce exactly.')
          PY
          python docs/tools/check_manual.py
      - name: Publish only documentation and remove the one-time importer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-manual-20261110.yml
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          base='d6ddf9c3bee58dc2209946a0073f8a708d964073'
          for name in subprocess.check_output(['git','diff','--name-only',base],text=True).splitlines():
              assert name in ('README.md','README_PL.md') or name.startswith('docs/'),name
          p=Path('docs/reports/DOCUMENTATION_FILES.json')
          d=json.loads(p.read_text())
          d['files']['README.md']=hashlib.sha256(Path('README.md').read_bytes()).hexdigest()
          for name in d['files']:
              d['files'][name]=hashlib.sha256(Path(name).read_bytes()).hexdigest()
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add README.md README_PL.md docs .github/workflows/import-manual-20261110.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add complete Polish M300 manual with original screenshots, 43 reproducible OLED renders and audited technical reference'
          git push origin HEAD:docs/manual-20261110
      - name: Preserve documentation verification report
        uses: actions/upload-artifact@v4
        with:
          name: M300_DOCUMENTATION_VERIFICATION
          path: docs/reports/
          if-no-files-found: error
