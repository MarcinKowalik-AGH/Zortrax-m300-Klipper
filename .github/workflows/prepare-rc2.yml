name: Prepare RC2 review
on:
  push:
    branches: [fix/rc2-legacy-xy-update-policy]
    paths: ['.github/workflows/prepare-rc2.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc2-legacy-xy-update-policy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the reviewed exact-signature migration and version metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,subprocess
          root=Path('.')
          base='ef61d295dc69308870a28a01a43f45ba77c16422'
          allowed={'.github/workflows/prepare-rc2.yml',
                   'host/update_template/tests/reference/reported_xy_200_20261112.cfg',
                   'host/update_template/tests/test_reported_xy_cleanup.py',
                   'docs/pl/RELEASE_v1.0.0-rc.2.md','docs/en/RELEASE_v1.0.0-rc.2.md'}
          assert set(subprocess.check_output(['git','diff','--name-only',base],text=True).splitlines())==allowed
          def write(p,s):Path(p).write_text(s)
          p=Path('host/update_template/RC_UI_BASELINES.json');b=json.loads(p.read_text())
          sig='53be4a2ac5933a02df7321ed45f99ef9fe82d82b59faead042f1c472ecf3580f'
          assert sig not in b['TEST_ZORTRAX_XY'];b['TEST_ZORTRAX_XY'].append(sig)
          p.write_text(json.dumps(b,indent=2)+'\n')
          old=Path('host/klippy/extras/m300_release.py').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='f8d475024da21f1c99186c38f1de9df2538258cc60a4bf2ff31dcf1618f4ce5b'
          Path('host/update_template/tests/reference/rc1_m300_release.txt').write_bytes(old)
          p=Path('host/update_template/SUPPORTED_BASELINES.json');b=json.loads(p.read_text())
          b.setdefault('m300_release.py',[]).append(hashlib.sha256(old).hexdigest())
          p.write_text(json.dumps(b,indent=2)+'\n')
          p=Path('PORT.json');b=json.loads(p.read_text());assert b['distribution_version']=='v1.0.0-rc.1'
          b.update(distribution_version='v1.0.0-rc.2',public_host_version='1.0.0-rc.2',menu_revision='1.0.0-rc.2',supersedes_version='v1.0.0-rc.1',self_contained_host_tests=820)
          p.write_text(json.dumps(b,indent=2)+'\n')
          for name in ('host/klippy/extras/m300_release.py','host/update_template/tests/test_rc_ui.py','host/update_template/tests/test_settings_information.py','host/update_template/install.py','ci/test_rc1_contracts.py','ci/test_release23_contracts.py','docs/tools/check_manual.py'):
              p=Path(name);s=p.read_text();assert '1.0.0-rc.1' in s
              s=s.replace('1.0.0-rc.1','1.0.0-rc.2')
              if name in ('ci/test_rc1_contracts.py','ci/test_release23_contracts.py'):
                  assert "['self_contained_host_tests'],813)" in s
                  s=s.replace("['self_contained_host_tests'],813)","['self_contained_host_tests'],820)")
              p.write_text(s)
          for name in ('README.md','README_PL.md','docs/pl/FIRST_INSTALL.md','docs/en/FIRST_INSTALL.md'):
              p=Path(name);s=p.read_text();assert 'v1.0.0-rc.1' in s
              s=s.replace('v1.0.0-rc.1','v1.0.0-rc.2')
              if name.startswith('README'):
                  s=s.replace('Klipper 1.0.0-rc.1','Klipper 1.0.0-rc.2').replace('[Wydanie RC1]','[Wydanie RC2]').replace('[Download RC1]','[Download RC2]')
                  s=s.replace('**Pierwszy kandydat do wydania','**Drugi kandydat do wydania').replace('**First release candidate','**Second release candidate')
                  if name=='README_PL.md':
                      s=s.replace('## Aktualizacja Orange Pi','**RC2:** instalator rozpoznaje dodatkowy starszy wariant `TEST_ZORTRAX_XY` zgłoszony 12 listopada. Usuwa tylko dokładnie rozpoznaną definicję. [Opis RC2 i aktualizacji systemu](docs/pl/RELEASE_v1.0.0-rc.2.md).\n\n## Aktualizacja Orange Pi')
                  else:
                      s=s.replace('## Existing Orange Pi installation','**RC2:** remove the exact legacy `TEST_ZORTRAX_XY` variant reported on 12 November without deleting custom macro bodies. [RC2 notes and update policy](docs/en/RELEASE_v1.0.0-rc.2.md).\n\n## Existing Orange Pi installation')
              p.write_text(s)
          p=Path('docs/reports/DOC_SOURCE_BASELINE.json');b=json.loads(p.read_text())
          b['current_reference_release']='v1.0.0-rc.2'
          b['note_rc2']='Exact legacy XY recognition added to installer; current runtime and historical images otherwise unchanged.'
          p.write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n')
          p=Path('docs/pl/INSTALLATION_AND_CI.md')
          p.write_text(p.read_text()+'\n## Uzupełnienie RC2: aktualizacje Moonrakera i systemu\n\n[Ocena dokładnego commita Moonrakera i pakietów zgłoszonych 12 listopada](RELEASE_v1.0.0-rc.2.md) rozdziela aktualizację portu M300, Moonrakera i sprzętowej części Armbiana. Nie używaj Update All. Samo `klipper {}` ze skróconego odczytu nie potwierdza aktualności repozytorium.\n')
          assert not subprocess.check_output(['git','diff',base,'--','mcu','frontend','host/config'])
          runtime=subprocess.check_output(['git','diff','--name-only',base,'--','host/klippy'],text=True).splitlines()
          assert runtime==['host/klippy/extras/m300_release.py'],runtime
          PY
      - name: Verify all host regressions and documentation
        run: |
          set -euo pipefail
          python -m pip install --quiet Jinja2==3.1.6 Pillow==11.3.0
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'ci')
          from project import stage_host_update
          stage_host_update(Path('.ci/rc2-tests'))
          PY
          (cd .ci/rc2-tests && python -m unittest discover -s tests -v)
          python ci/test_install_orange_pi.py
          python ci/test_fluidd_selection.py
          python ci/test_retry_failed_workflow.py
          python ci/test_acceptance_register.py
          python ci/test_release23_contracts.py
          python ci/test_rc1_contracts.py
          python ci/acceptance_register.py --check
          python docs/tools/check_manual.py --output docs/reports/DOCUMENTATION_RC2_VALIDATION.json
      - name: Commit validated non-workflow files to the isolated branch
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('docs/reports/DOCUMENTATION_FILES.json');b=json.loads(p.read_text())
          for name in b['files']:
              b['files'][name]=hashlib.sha256(Path(name).read_bytes()).hexdigest()
          for name in ('docs/pl/RELEASE_v1.0.0-rc.2.md','docs/en/RELEASE_v1.0.0-rc.2.md','docs/reports/DOCUMENTATION_RC2_VALIDATION.json'):
              b['files'][name]=hashlib.sha256(Path(name).read_bytes()).hexdigest()
          p.write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n')
          PY
          git add PORT.json README.md README_PL.md ci host docs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'RC2: recognize exact reported legacy XY macro and document independent update policy'
          git push origin HEAD:fix/rc2-legacy-xy-update-policy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M300_RC2_PREPARATION
          path: docs/reports/DOCUMENTATION_RC2_VALIDATION.json
          retention-days: 7
          if-no-files-found: warn
