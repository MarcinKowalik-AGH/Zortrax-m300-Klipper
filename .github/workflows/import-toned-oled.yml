name: Import and verify toned M300 OLED
on:
  push:
    branches: [feat/beta21-toned-oled]
    paths: ['.github/workflows/import-toned-oled.yml']
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/beta21-toned-oled
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import exact files without overwriting a changed baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url=$(gh api repos/MarcinKowalik-AGH/Zortrax-m300-Klipper/git/blobs/b4d8655e25e8a6ac2f1bafdd650d4f3fd2f3bf2b --jq .content | base64 --decode)
          echo "::add-mask::$url"
          curl --fail --silent --show-error --location --retry 2 "$url" -o "$RUNNER_TEMP/toned.zip"
          echo '7c458d55ad11cb5fce7fe168e3d3dd53e5a8f0fdaaee9c7c116fb9f5a3eb4770  '"$RUNNER_TEMP/toned.zip" | sha256sum -c -
          python - <<'PY'
          import hashlib,json,os,stat,subprocess,zipfile
          from pathlib import Path
          root=Path.cwd().resolve()
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'toned.zip') as z:
              manifest=json.loads(z.read('_PATCH_MANIFEST.json'))
              assert manifest['base_commit']=='175e4d5d9a53327165234e057cf8e2b563ebfb9c'
              subprocess.run(['git','merge-base','--is-ancestor',manifest['base_commit'],'HEAD'],check=True)
              assert len(manifest['files'])==35
              assert set(z.namelist())==set(manifest['files'])|{'_PATCH_MANIFEST.json'}
              assert sum(i.file_size for i in z.infolist())<5000000
              staged=[]
              for name,hashes in manifest['files'].items():
                  p=Path(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert name in ('PORT.json','README.md','README_PL.md') or name.startswith(('ci/','docs/','host/','mcu/SOURCE_MCU/'))
                  assert not stat.S_ISLNK(z.getinfo(name).external_attr>>16)
                  target=root/p
                  assert target.resolve().is_relative_to(root) and not target.is_symlink()
                  old=hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else None
                  assert old==hashes['before'],(name,'baseline changed')
                  data=z.read(name)
                  assert hashlib.sha256(data).hexdigest()==hashes['after'],name
                  staged.append((target,data))
              for target,data in staged:
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          baseline=json.loads(Path('docs/reports/ACTIVITY_TONES_BASELINE.json').read_text())
          for name,digest in baseline['unmodified_files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          print('Imported 35 checked files; OEM sprites, motion, fault policy and frontend unchanged.')
          PY
      - name: Check every host and MCU icon and native local renderer
        run: |
          python ci/generate_error_catalog.py --check
          python ci/check_ui_symbols.py -v
          python ci/check_toned_activity.py
          cc -std=c11 -O2 -Wall -Wextra -Werror mcu/SOURCE_MCU/tests/test_panel.c -o "$RUNNER_TEMP/panel-test"
          "$RUNNER_TEMP/panel-test"
          git diff --check
      - name: Commit source update and remove one-time bootstrap workflows
        run: |
          set -euo pipefail
          rm .github/workflows/import-toned-oled.yml .github/workflows/prepare-toned-oled.yml
          git add PORT.json README.md README_PL.md ci docs host mcu/SOURCE_MCU .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add beta.21 toned 4bpp host and autonomous MCU artwork with exact cross-renderer tests'
          git push origin HEAD:feat/beta21-toned-oled
      - uses: actions/upload-artifact@v4
        with:
          name: M300_BETA21_TONED_IMPORT_CHECKS
          path: .ci/reports/OLED_TONES.json
          if-no-files-found: error
