name: Orca M300 profile audit
on:
  push:
    branches: ['feature/orca-m300-classic-0p20']
    paths: ['orca/**', '.github/workflows/orca-profile-audit.yml']
  pull_request:
    paths: ['orca/**', '.github/workflows/orca-profile-audit.yml']
permissions:
  contents: read
jobs:
  slice:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install graphical runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0t64 libwebkit2gtk-4.1-0 libglu1-mesa libsecret-1-0 libgstreamer1.0-0 libgl1-mesa-dri
      - name: Fetch pinned official OrcaSlicer 2.3.2
        run: |
          mkdir -p "$RUNNER_TEMP/orca"
          cd "$RUNNER_TEMP/orca"
          curl --fail --location --retry 3 -o Orca.AppImage 'https://github.com/OrcaSlicer/OrcaSlicer/releases/download/v2.3.2/OrcaSlicer_Linux_AppImage_Ubuntu2404_V2.3.2.AppImage'
          echo 'c64336ceec37d941766e675cbaaaf5124e184402bf18177fbf81ba5102734ad8  Orca.AppImage' | sha256sum -c -
          chmod +x Orca.AppImage
          ./Orca.AppImage --appimage-extract >/dev/null
          xvfb-run -a "$RUNNER_TEMP/orca/squashfs-root/AppRun" --help > "$RUNNER_TEMP/orca/help.txt"
          cat "$RUNNER_TEMP/orca/help.txt"
      - name: Slice all catalog entries and inspect G-code
        run: |
          xvfb-run -a python3 orca/tests/audit_slice.py \
            --orca "$RUNNER_TEMP/orca/squashfs-root/AppRun" \
            --bundle orca/Zortrax_M300_Classic_0p20_18_filaments.orca_printer \
            --out "$RUNNER_TEMP/orca-audit"
      - name: Publish the verified one-time R2 correction to the draft branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/orca-m300-classic-0p20'
        env:
          TARGET_BRANCH: feature/orca-m300-classic-0p20
        run: |
          # Only replace the exact old package audited in this correction.
          old_hash=$(sha256sum orca/Zortrax_M300_Classic_0p20_18_filaments.orca_printer | cut -d' ' -f1)
          if [ "$old_hash" != 'b696611f54e3805a35304b78a781d7392bb4f170dd4722e251af1cb4b28ce32f' ]; then
            echo 'R2 already published or package changed; no repository write.'
            exit 0
          fi
          git fetch origin "$TARGET_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo 'Draft branch advanced; refusing stale publication.'
            exit 1
          fi
          python3 - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'orca-audit'
          summary=json.loads((root/'summary.json').read_text())
          assert summary['pass_count']==17 and summary['fail_count']==0
          candidate=root/'Zortrax_M300_Classic_0p20_R2.orca_printer'
          assert hashlib.sha256(candidate.read_bytes()).hexdigest()==summary['bundle_sha256']
          assert summary['bundle_sha256']=='e1e0407a3ff23c8a2d82ba9db7a7122a65df7ac6ec400473601024e402c57363'
          with zipfile.ZipFile(candidate) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('bundle_structure.json'))
              schema={key:[len(json.loads(z.read(n))) for n in manifest[field]] for key,field in [('printer','printer_config'),('process','process_config'),('filament','filament_config')]}
              assert schema['printer']==[144] and schema['process']==[334] and schema['filament']==[123]*18
          shutil.copyfile(candidate,'orca/Zortrax_M300_Classic_0p20_18_filaments.orca_printer')
          shutil.copyfile(root/'results.json','orca/ORCA_RUNTIME_RESULTS_R2.json')
          summary.update(schema_fields=schema,zip_crc='PASS',tested_commit=os.environ['GITHUB_SHA'],workflow_run_id=os.environ['GITHUB_RUN_ID'])
          Path('orca/VALIDATION_RESULTS.json').write_text(json.dumps(summary,indent=2)+'\n')
          legacy=Path('orca/VALIDATION_M300_0p20.md')
          legacy.write_text('> ARCHIWALNY AUDYT STATYCZNY. Wyniki testu rzeczywistego i korekty R2: [ORCA_RUNTIME_AUDIT_R2.md](ORCA_RUNTIME_AUDIT_R2.md). W szczegolnosci stary opis blokady PEEK i braku testu slicera jest nieaktualny.\n\n'+legacy.read_text())
          readme=Path('orca/README.md')
          readme.write_text('> Aktualny pakiet: **R2**, sprawdzony w silniku OrcaSlicer 2.3.2: 17 profili PASS G-code, PEEK tylko katalog. [Wyniki i ograniczenia](ORCA_RUNTIME_AUDIT_R2.md). Zastap poprzedni preset po imporcie. Nie wykonano testu GUI ani fizycznego wydruku.\n\n'+readme.read_text())
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add orca/Zortrax_M300_Classic_0p20_18_filaments.orca_printer orca/ORCA_RUNTIME_RESULTS_R2.json orca/VALIDATION_RESULTS.json orca/VALIDATION_M300_0p20.md orca/README.md
          git commit -m 'Publish runtime-validated M300 Orca R2 bed-temperature and Klipper command corrections'
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Save audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m300-orca-2.3.2-audit
          path: |
            ${{ runner.temp }}/orca-audit
            ${{ runner.temp }}/orca/help.txt
          retention-days: 14
