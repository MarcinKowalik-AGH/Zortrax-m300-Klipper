name: Verify RC1 migration correction
on:
  push:
    branches: [release/rc1-ui-consistency]
    paths: ['.github/workflows/prepare-rc1.yml']
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rc1-ui-consistency
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix the observed idempotence defect without weakening custom-macro checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          r=Path.cwd()
          p=r/'host/update_template/m300_rc_ui.py';s=p.read_text()
          old="options = set(re.findall(r'^([^\\s#;][^:=\\r\\n]*?)[=:]', block, re.M))"
          new="options = {key.strip().lower() for key in re.findall(\n        r'^([^\\s#;][^:=\\r\\n]*?)[=:]', block, re.M)}"
          assert old in s;s=s.replace(old,new);p.write_text(s)
          p=r/'host/klippy/extras/m300_menu.py';s=p.read_text()
          old="('Print status', ('page', 'native_job'))]"
          new="('Print status', ('page', 'native_job')),\n                    ('Diagnostics', ('page', 'diagnostics'))]"
          assert old in s;s=s.replace(old,new);p.write_text(s)
          p=r/'host/update_template/tests/test_rc_ui.py';s=p.read_text()
          old="self.assertFalse(hidden_test('ZORTRAX_PROCEDURE'))"
          new=old+"\n        menu.page='klipper'\n        self.assertIn(('Diagnostics',('page','diagnostics')),menu.rows(1)[1])"
          assert old in s;s=s.replace(old,new)
          anchor='    def test_custom_test_body_and_include_are_retained(self):'
          assert anchor in s
          extra='''    def test_equals_style_stock_macro_is_removed_on_the_first_organized_pass(self):
                  h=self.setup_install()
                  text=('[mcu]\\nserial: /dev/ttyS1\\n[m300_mcu]\\nnative_control: True\\n'
                        '[gcode_macro ZORTRAX_OLED_PERF]\\ndescription = Reset OLED samples\\n'
                        'gcode = \\n\\tZORTRAX_OLED_PERF_RESET\\n')
                  h.config.write_text(text)
                  receipt=install.apply(h.root,h.config,install.plan(h.root,h.config,organize_config=True))
                  self.assertNotIn('[gcode_macro ZORTRAX_OLED_PERF]',h.config.read_text())
                  self.assertEqual(install.plan(h.root,h.config,organize_config=True),[])
                  install.rollback(receipt,h.root,h.config)
                  self.assertEqual(h.config.read_text(),text)

          '''
          # Normalize source indentation of the added class method.
          lines=extra.splitlines();extra=lines[0]+'\n'+'\n'.join(line[10:] if line.startswith('          ') else line for line in lines[1:])+'\n'
          s=s.replace(anchor,extra+anchor);compile(s,str(p),'exec');p.write_text(s)
          p=r/'PORT.json';d=json.loads(p.read_text());assert d['self_contained_host_tests']==812;d['self_contained_host_tests']=813;p.write_text(json.dumps(d,indent=2)+'\n')
          p=r/'ci/test_rc1_contracts.py';s=p.read_text().replace("meta['self_contained_host_tests'],812","meta['self_contained_host_tests'],813");p.write_text(s)
          p=r/'docs/pl/CODE_REVIEW_RC1.md';s=p.read_text().replace('dodano 18 przypadków RC1 (łącznie\n812)','dodano 19 przypadków RC1 (łącznie\n813)');p.write_text(s)
          p=r/'docs/reports/DOC_SOURCE_BASELINE.json';d=json.loads(p.read_text())
          for name in d['files']:d['files'][name]=hashlib.sha256((r/name).read_bytes()).hexdigest()
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Recheck all host regressions and current manuals
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow==11.3.0 Jinja2==3.1.6
          python - <<'PY'
          import sys
          sys.path.insert(0,'ci')
          from project import stage_host_update
          stage_host_update('.ci/rc1-host')
          PY
          (cd .ci/rc1-host && python -m unittest discover -s tests)
          python ci/test_rc1_contracts.py
          python ci/test_install_orange_pi.py
          python docs/tools/check_manual.py --output docs/reports/DOCUMENTATION_RC1_VALIDATION.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('docs/reports/DOCUMENTATION_FILES.json');d=json.loads(p.read_text())
          for n in d['files']:
              if Path(n).is_file():d['files'][n]=hashlib.sha256(Path(n).read_bytes()).hexdigest()
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git diff --check
          git add PORT.json host ci/test_rc1_contracts.py docs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix first-pass equals-style stock macro cleanup and retain Diagnostics without lab menu'
          git push origin HEAD:release/rc1-ui-consistency
