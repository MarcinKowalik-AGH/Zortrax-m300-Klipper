name: Prepare RC1 source review
on:
  push:
    branches: [release/rc1-ui-consistency]
    paths: ['.github/workflows/prepare-rc1.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rc1-ui-consistency
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile active manuals without rewriting historical evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,hashlib
          root=Path.cwd()
          assert json.loads(Path('PORT.json').read_text())['distribution_version']=='v1.0.0-rc.1'
          pl=('OVERVIEW_PL.md','USER_GUIDE.md','TECHNICAL_REFERENCE.md','BED_MESH_AND_LEVELING.md','PRINT_LIMITS_AND_PLANNER.md','INSTALL.md','INSTALLATION_AND_CI.md','PRINT_CONTROL.md')
          en=('FEATURES.md','LEVELING.md','SETTINGS_INFORMATION.md','UI_SYMBOLS.md','INSTALL.md','MAINTENANCE_MATERIAL.md','MODELS_SD.md','ERRORS.md')
          for lang,names in (('pl',pl),('en',en)):
              for name in names:
                  path=root/'docs'/lang/name
                  if not path.exists():continue
                  s=path.read_text()
                  s=re.sub(r'> Dokumentacja dla \*\*M300 Classic\*\*, stan kodu \*\*v1\.0\.0-beta\.20\*\*, commit `[^`]+`\.', '> Dokumentacja dla **M300 Classic**, wydanie **1.0.0-rc.1**. Historyczne ilustracje mają jawny punkt odniesienia beta.20.',s)
                  s=re.sub(r'> Current UI documentation \(beta\.20, 10 November 2026\):[^\n]+', '> RC1 interface: [current OLED/macro reference](RC1_UI.md). The [65-screen illustrated guide](../pl/OLED_FUNCTIONS.md) retains explicitly historical beta.20 renders. Implementation history and raw ABI identities below remain evidence, not RC display labels.',s)
                  for a,b in (('M300_HOST_R16_12_NORMAL_UI','M300_HOST'),('M300_FLUIDD_1_37_7_R16_12.zip','M300_FLUIDD.zip'),('M300_R14_19_SD.zip','M300_SD.zip')):s=s.replace(a,b)
                  s=s.replace('**Instalator beta.23:**','**Instalator RC1:**').replace('**Beta.23 installer:**','**RC1 installer:**')
                  if name=='INSTALL.md':
                      s=s.replace('v1.0.0-beta.23','v1.0.0-rc.1').replace('pierwsza instalacja v1.0.0-beta.2','pierwsza instalacja RC1')
                      s=s.replace('The main package pairs the native R16.12 host with MCU R14.19 for M300 Classic.','The RC1 package pairs host 1.0.0-rc.1 with the unchanged MCU R14.19 application for M300 Classic.')
                      s=s.replace('host R16.12,','host 1.0.0-rc.1,').replace('## Current beta.20 user interface','## RC1 user interface')
                      s=s.replace('[10 November update summary](FRONTEND_BETA20.md)','[current RC1 interface reference](RC1_UI.md)')
                  if name=='PRINT_CONTROL.md':s=s.replace('**Stan instrukcji: beta.24, ustalenia testu z 11 listopada 2026.**','**Stan instrukcji: RC1, z zachowaniem ustaleń testu z 11 listopada 2026.**')
                  if name=='TECHNICAL_REFERENCE.md':
                      s=s.replace('| Warstwa | beta.20 |','| Warstwa | RC1 |').replace('| Dystrybucja | v1.0.0-beta.20; źródło `4828a9da` |','| Dystrybucja / publiczny host | v1.0.0-rc.1 / 1.0.0-rc.1 |')
                  if name=='USER_GUIDE.md':
                      s=s.replace('**TEST M300** to osobne czynności diagnostyczne — nie uruchamiaj ich w ciemno.', 'Laboratoryjna grupa **TEST M300** nie jest częścią RC1. Odczyty daje `ZORTRAX_DIAGNOSTICS`; OEM-owy test wentylatorów pozostaje w Maintenance. Jasność otwierają `ZORTRAX_OLED_BRIGHTNESS` i `ZORTRAX_LED_BRIGHTNESS`.')
                      s=s.replace('Procedury zapewniają odsunięcie platformy od dyszy o 5 mm przed ruchem XY, zgodnie z bieżącym stanem osi i kontaktem.', 'Homing respektuje `z_contact_clearance`: domyślnie 5 mm, a na zakwalifikowanym egzemplarzu 2 mm; PC7 musi zostać rozwarty przed ruchem XY. Niezależna wysokość przejazdów M07 `safe_z` pozostaje 5 mm.')
                      s=s.replace('| Działanie | Wynik w beta.20 |','| Działanie | Zachowanie zachowane w RC1 |')
                      s=s.replace('Dla beta.20:','Zachowane identyfikatory diagnostyczne (nie publiczna nazwa RC1):')
                  if name=='FEATURES.md':
                      s=s.replace('# R16.9 features and acceptance boundaries','# RC1 features and acceptance boundaries')
                      s=s.replace('are Klipper, Zortrax M300 and Service / Tests.', 'are Klipper and Zortrax M300; the laboratory Service / Tests route has been removed.')
                      s=s.replace('keeps Klipper / ZORTRAX M300 / TEST M300 categories and unrelated user settings.', 'keeps Klipper / ZORTRAX M300 categories and unrelated user settings. Stock lab shortcuts are removed, custom lab definitions are preserved but hidden. Brightness and current-procedure shortcuts use the existing owners.')
                  if name=='LEVELING.md':s=s.replace('# Autocalibration and Z reference — R16.12','# Autocalibration and Z reference — RC1')
                  if name=='SETTINGS_INFORMATION.md':
                      anchor='In Fluidd, the setting macros open button dialogs when called without'
                      s=s.replace(anchor,'RC1 adds direct `ZORTRAX_OLED_BRIGHTNESS LEVEL=8` and\n`ZORTRAX_LED_BRIGHTNESS LEVEL=8` shortcuts. Omit LEVEL to open the shared\ncontrol. Only integers 1..16 are accepted; no rounding or separate settings store.\n\n'+anchor)
                  path.write_text(s)
          p=root/'docs/pl/DOCUMENTATION_CHECK.md';s=p.read_text()
          s=s.replace('# Kontrola dokumentacji beta.20 i pochodzenie ilustracji','# Kontrola dokumentacji RC1 i pochodzenie ilustracji')
          s=s.replace('Stan opisu: **10 listopada 2026, beta.20**, kod odniesienia `4828a9da9d5fd8b0b93eb2ac267732ee7e49d506`. Zmiana dokumentacji nie zmienia wykonawczego hosta, MCU, frontendu ani konfiguracji. Nie utworzono nowej bety tylko dla manuali.','Bieżący opis dotyczy **RC1**. Ilustracje z beta.20 zachowują pierwotny kod odniesienia `4828a9da9d5fd8b0b93eb2ac267732ee7e49d506`; nie są przedstawiane jako nowe zrzuty RC1. Aktualne menu, makra i różnice opisuje [RC1_UI](RC1_UI.md).')
          s=s.replace('wskazują opublikowaną beta.20','wskazują wydanie RC1').replace('Current UI po angielsku | FRONTEND_BETA20','Current UI po angielsku | RC1_UI; historyczny FRONTEND_BETA20').replace('zgodność wszystkich 39 makr','zgodność wszystkich 41 makr').replace('[Raport](../reports/DOCUMENTATION_VALIDATION.json)','[Raport RC1](../reports/DOCUMENTATION_RC1_VALIDATION.json)')
          s=s.replace('## Co rzeczywiście potwierdzono','## Co rzeczywiście potwierdzono — historyczna baza ilustracji')
          s=s.replace('python docs/tools/render_oled_manual.py --klipper .ci/pristine','\n# Historyczne rendery odtwarzaj na ich wskazanym commicie beta.20.\n# Nie zastępuj manifestu beta.20 bieżącymi renderami RC1.')
          p.write_text(s)
          PY
      - name: Validate final manuals and refresh document checksums
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow==11.3.0 Jinja2==3.1.6
          python ci/test_rc1_contracts.py
          python docs/tools/check_manual.py --output docs/reports/DOCUMENTATION_RC1_VALIDATION.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('docs/reports/DOCUMENTATION_FILES.json');d=json.loads(p.read_text())
          for n in d['files']:
              target=Path(n)
              if target.is_file():d['files'][n]=hashlib.sha256(target.read_bytes()).hexdigest()
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git diff --check
          git add docs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reconcile active RC1 manuals with cleaned menu, 41 macros and qualified homing clearance'
          git push origin HEAD:release/rc1-ui-consistency
