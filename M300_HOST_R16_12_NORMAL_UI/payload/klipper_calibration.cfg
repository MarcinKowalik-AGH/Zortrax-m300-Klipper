# Standard Klipper calibration aliases. Fluidd category: Klipper.
[gcode_macro PID_HOTEND]
description: Native hotend PID calibration; save separately
gcode:
    PID_CALIBRATE HEATER=extruder TARGET={params.TARGET|default(200)|float}

[gcode_macro PID_BED]
description: Native bed PID calibration; save separately
gcode:
    PID_CALIBRATE HEATER=heater_bed TARGET={params.TARGET|default(60)|float}

[gcode_macro PID_SAVE]
description: Save native calibration and restart Klipper
gcode:
    SAVE_CONFIG
