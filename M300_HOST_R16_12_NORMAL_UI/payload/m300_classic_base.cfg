# Zortrax M300 Classic v1 beta: original board, hotend, contact plate and 0.4 mm nozzle.
# Starting PID/E values require per-printer calibration. Verify Y305 clearance before homing/printing.
# UART/path tokens are rendered only by install-fresh.py.

[include m300_temperature_sensors.cfg]

[mcu]
serial: @SERIAL@
baud: @BAUD@
restart_method: command

[m300_mcu]
native_control: True
allow_actuators: True
allow_motion: True
allow_heating: True
require_local_cooling: True

[m300_io]

[m300_resources]
require_motion_owner: True
require_calibration_workflow: M07_STOCK

[m300_oled]
spi_speed: 4500000
chunk_interval: 0.002
refresh_interval: 0.2

[m300_oled_link]
automatic: True
max_retries: 2
retry_delay: 1.5

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 700
max_z_velocity: 25
max_z_accel: 50
square_corner_velocity: 2

[stepper_x]
step_pin: PB3
dir_pin: !PD9
enable_pin: PD14
microsteps: 128
full_steps_per_rotation: 200
rotation_distance: 40
step_pulse_duration: 0.000002
endstop_pin: ^!PE12
position_endstop: 0
position_min: 0
position_max: 300
homing_speed: 20
homing_retract_dist: 2
homing_retract_speed: 10

[stepper_y]
step_pin: PB4
dir_pin: PD13
enable_pin: PD14
microsteps: 128
full_steps_per_rotation: 200
rotation_distance: 40
step_pulse_duration: 0.000002
endstop_pin: ^!PC6
position_endstop: 0
position_min: 0
position_max: 305
homing_speed: 20
homing_retract_dist: 2
homing_retract_speed: 10

[stepper_z]
step_pin: PB7
dir_pin: !PC12
enable_pin: PD14
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 8
step_pulse_duration: 0.000002
endstop_pin: probe:z_virtual_endstop
position_min: 0
position_max: 300
homing_speed: 4
homing_retract_dist: 1

[probe]
pin: ^!PC7
x_offset: 0
y_offset: 0
z_offset: 0
speed: 1
lift_speed: 1
samples: 1
sample_retract_dist: 1

[extruder]
step_pin: PA0
dir_pin: PD0
enable_pin: PD14
microsteps: 128
full_steps_per_rotation: 200
rotation_distance: 26.133
step_pulse_duration: 0.000002
nozzle_diameter: 0.4
filament_diameter: 1.75
max_extrude_only_distance: 50
max_extrude_only_velocity: 45
max_extrude_only_accel: 4000
heater_pin: PC8
sensor_type: M300_HOTEND_STOCK_LINEAR_LAB
sensor_pin: PB1
adc_voltage: 3.270
voltage_offset: 0
max_power: 1.0
pwm_cycle_time: 0.100
min_temp: 5
max_temp: 270
min_extrude_temp: 170
control: pid
pid_kp: 15.152
pid_ki: 0.472
pid_kd: 121.598

[heater_bed]
heater_pin: PC9
sensor_type: M300_BED_STOCK_TABLE_LAB
sensor_pin: PB0
adc_voltage: 3.270
voltage_offset: 0
max_power: 1.0
pwm_cycle_time: 0.100
min_temp: 5
max_temp: 120
control: pid
pid_kp: 61.966
pid_ki: 1.410
pid_kd: 680.852

[fan]
pin: PE13
cycle_time: 0.010
hardware_pwm: False
shutdown_speed: 1
kick_start_time: 0

[heater_fan hotend]
pin: PE14
heater: extruder
heater_temp: 50
fan_speed: 1
cycle_time: 0.010
hardware_pwm: False
shutdown_speed: 1
kick_start_time: 0

[output_pin m300_led_r]
cycle_time: 0.010
pwm: True
pin: PD7
value: 0
shutdown_value: 0

[output_pin m300_led_g]
cycle_time: 0.010
pwm: True
pin: PB5
value: 0
shutdown_value: 0

[output_pin m300_led_b]
cycle_time: 0.010
pwm: True
pin: PD6
value: 0
shutdown_value: 0

[output_pin m300_buzzer]
pin: PC4
value: 0
shutdown_value: 0

[display_status]

[respond]

[virtual_sdcard]
path: @DATA@/gcodes

[pause_resume]
recover_velocity: 10

[idle_timeout]
timeout: 300
gcode:
    {% if printer.m300_print_control is defined and (printer.m300_print_control.paused or printer.m300_print_control.busy) %}
        ZORTRAX_PAUSE_IDLE
    {% else %}
        TURN_OFF_HEATERS
        ZORTRAX_IDLE_RELEASE_XYE
    {% endif %}

[include m300_services.cfg]
[include m300_operations.cfg]
[include klipper_calibration.cfg]
[include m300_display.cfg]
