[gcode_macro ZORTRAX_BED_MESH]
description: Native 25-point pad mesh; edit pad centers and sizes, PREVIEW=1 shows points without moving
gcode:
    {% if printer.m300_pad_mesh is not defined %}
        {action_raise_error("Enable [bed_mesh] and [m300_pad_mesh] before measuring the pads")}
    {% endif %}
    BED_MESH_CALIBRATE {% if params.PROFILE is defined %}PROFILE={params.PROFILE}{% endif %} {% if params.PREVIEW is defined %}PREVIEW={params.PREVIEW}{% endif %} {% if params.CORNER_PAD_WIDTH is defined %}CORNER_PAD_WIDTH={params.CORNER_PAD_WIDTH}{% endif %} {% if params.CENTER_PAD_WIDTH is defined %}CENTER_PAD_WIDTH={params.CENTER_PAD_WIDTH}{% endif %} {% if params.EDGE_MARGIN is defined %}EDGE_MARGIN={params.EDGE_MARGIN}{% endif %} {% if params.FRONT_RIGHT_X is defined %}FRONT_RIGHT_X={params.FRONT_RIGHT_X}{% endif %} {% if params.FRONT_RIGHT_Y is defined %}FRONT_RIGHT_Y={params.FRONT_RIGHT_Y}{% endif %} {% if params.FRONT_LEFT_X is defined %}FRONT_LEFT_X={params.FRONT_LEFT_X}{% endif %} {% if params.FRONT_LEFT_Y is defined %}FRONT_LEFT_Y={params.FRONT_LEFT_Y}{% endif %} {% if params.CENTER_X is defined %}CENTER_X={params.CENTER_X}{% endif %} {% if params.CENTER_Y is defined %}CENTER_Y={params.CENTER_Y}{% endif %} {% if params.REAR_RIGHT_X is defined %}REAR_RIGHT_X={params.REAR_RIGHT_X}{% endif %} {% if params.REAR_RIGHT_Y is defined %}REAR_RIGHT_Y={params.REAR_RIGHT_Y}{% endif %} {% if params.REAR_LEFT_X is defined %}REAR_LEFT_X={params.REAR_LEFT_X}{% endif %} {% if params.REAR_LEFT_Y is defined %}REAR_LEFT_Y={params.REAR_LEFT_Y}{% endif %} {% if params.FIT_TRAVEL is defined %}FIT_TRAVEL={params.FIT_TRAVEL}{% endif %} {% if params.TRAVEL_MARGIN is defined %}TRAVEL_MARGIN={params.TRAVEL_MARGIN}{% endif %}
