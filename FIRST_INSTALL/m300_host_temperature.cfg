# Optional host CPU temperature: one series named Host in Fluidd.
# Enable in printer.cfg: [include m300_host_temperature.cfg]
# Disable in printer.cfg: # [include m300_host_temperature.cfg]
# This path was confirmed as cpub_thermal_zone on Orange Pi Zero 4 / A733.
# On another board, identify its CPU zone with read-host-temperatures.py first.
# Other thermal zones remain available through that read-only command.

[temperature_sensor Host]
sensor_type: temperature_host
sensor_path: /sys/class/thermal/thermal_zone0/temp
