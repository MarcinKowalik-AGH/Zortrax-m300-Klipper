# Optional USB camera on the Linux host. This file is NOT a Klipper include.
# Opcjonalna kamera USB na Orange Pi. Nie dodawaj tego pliku do printer.cfg.
# After editing / po zmianie: python3 install-camera.py --apply
[camera]
enabled: False
# auto selects one USB video capture device and saves its stable device path.
device: auto
resolution: 640x480
fps: 10
# auto prefers camera MJPEG; YUYV is available for cameras without MJPEG.
format: auto
# Local streaming backend; the browser uses the existing Fluidd port below.
port: 8088
fluidd_port: 4480
