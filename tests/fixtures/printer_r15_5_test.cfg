[mcu]
serial = /dev/ttyS1
baud = 1500000
restart_method = command

[m300_mcu]
native_control = True
allow_actuators = True
allow_motion = True
allow_heating = True
require_local_cooling = True

[m300_io]

[m300_resources]
require_motion_owner = True
require_calibration_workflow = M07_STOCK
require_cycle_owner = True

[m300_oled]
spi_speed = 4500000
chunk_interval = 0.002
refresh_interval = 0.2

[m300_oled_link]
automatic = True
max_retries = 2
retry_delay = 1.5

[printer]
kinematics = cartesian
max_velocity = 200
max_accel = 700
max_z_velocity = 1
max_z_accel = 10
square_corner_velocity = 2

[stepper_x]
step_pin = PB3
dir_pin = !PD9
enable_pin = PD14
microsteps = 128
full_steps_per_rotation = 200
rotation_distance = 40
step_pulse_duration = 0.000002
endstop_pin = ^!PE12
position_endstop = 0
position_min = 0
position_max = 300
homing_speed = 20
homing_retract_dist = 2
homing_retract_speed = 10

[stepper_y]
step_pin = PB4
dir_pin = PD13
enable_pin = PD14
microsteps = 128
full_steps_per_rotation = 200
rotation_distance = 40
step_pulse_duration = 0.000002
endstop_pin = ^!PC6
position_endstop = 0
position_min = 0
position_max = 300
homing_speed = 20
homing_retract_dist = 2
homing_retract_speed = 10

[stepper_z]
step_pin = PB7
dir_pin = !PC12
enable_pin = PD14
microsteps = 16
full_steps_per_rotation = 200
rotation_distance = 8
step_pulse_duration = 0.000002
endstop_pin = probe:z_virtual_endstop
position_min = 0
position_max = 30
homing_speed = 0.5
homing_retract_dist = 1

[probe]
pin = ^!PC7
x_offset = 0
y_offset = 0
z_offset = 0
speed = 1
lift_speed = 1
samples = 1
sample_retract_dist = 1

