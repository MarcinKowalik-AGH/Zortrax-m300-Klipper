[gcode_macro ZORTRAX_PROCEDURE]
description = Current M300 procedure and phase-bound operator buttons
gcode = 
	ZORTRAX_PROCEDURE_SHOW

[gcode_macro ZORTRAX_STATUS]
description = M300 shared procedure, board and OLED status
gcode = 
	ZORTRAX_PROCEDURE_STATUS
	ZORTRAX_FANS_STATUS
	ZORTRAX_MCU_STATUS
	ZORTRAX_OLED_STATUS

[gcode_macro ZORTRAX_LOAD]
description = Load filament through M03; specify TEMP
gcode = 
	ZORTRAX_PROCEDURE_START OP=LOAD TEMP={params.TEMP|default(0)|float}

[gcode_macro ZORTRAX_UNLOAD]
description = Unload filament through M03; specify TEMP
gcode = 
	ZORTRAX_PROCEDURE_START OP=UNLOAD TEMP={params.TEMP|default(0)|float}

[gcode_macro ZORTRAX_CHANGE]
description = M03 filament change; leaves the parent print paused
gcode = 
	ZORTRAX_PROCEDURE_START OP=CHANGE

[gcode_macro ZORTRAX_LEVEL]
description = M300 M07: explicit nozzle TEMP=195..245C; M07 itself verifies heating
gcode =
    {% set temp = params.TEMP|default(0)|float %}
    {% if temp < 195 or temp > 245 %}
      {action_raise_error("M300 M07 requires TEMP=195..245C matched to material; no contact without verified hot nozzle.")}
    {% endif %}
    ZORTRAX_PROCEDURE_START OP=LEVEL TEMP={temp}

[gcode_macro ZORTRAX_PRINT]
description = M08 checked file start; specify FILENAME relative to gcodes
gcode = 
	{% if params.FILENAME is not defined %}
	{action_raise_error("Select a checked file: ZORTRAX_PRINT FILENAME=...")}
	{% endif %}
	START_PRINT {rawparams}

[gcode_macro ZORTRAX_OLED_PERF]
description = Reset OLED performance samples without resetting the link
gcode = 
	ZORTRAX_OLED_PERF_RESET

[display_template _printing_time]
text = 
	{% set ptime = printer.print_stats.print_duration %}
	{ "%02d:%02d" % (ptime // (60 * 60), (ptime // 60) % 60) }

[gcode_macro ZORTRAX_FANS]
description = M300 fan requests, MCU override and automatic cooling
gcode = 
	ZORTRAX_FANS_STATUS

[gcode_macro CANCEL_PRINT]
description = Cancel native print and turn off heaters
rename_existing = CANCEL_PRINT_BASE
gcode = 
	TURN_OFF_HEATERS
	CANCEL_PRINT_BASE

[m300_lifecycle]

[m300_thermal]
native_control = True

[gcode_macro PID_STATUS]
description = Thermal state, pending native PID results, LEDs and response checks
gcode = 
	THERMAL_STATUS

[gcode_macro PID_HOTEND]
description = Native hotend PID; default TARGET=200; no automatic save
gcode = 
	PID_CALIBRATE HEATER=extruder TARGET={params.TARGET|default(200)|float}

[gcode_macro PID_BED]
description = Native bed PID; default TARGET=60; no automatic save
gcode = 
	PID_CALIBRATE HEATER=heater_bed TARGET={params.TARGET|default(60)|float}

[gcode_macro PID_SAVE]
description = Native SAVE_CONFIG
gcode = 
	SAVE_CONFIG

[gcode_macro ZORTRAX_Z_SAFETY]
description = M300 Z400 startup profile: read-only safety check, no motion
gcode =
    RESPOND TYPE=echo MSG="M300 Z400 R15.5.0 automatic HOTEND 220C before G28Z, UNQUALIFIED; nominal 400 steps/mm; motion 0-30mm, home search 15mm. No long moves!"
    ZORTRAX_MOTION_STATUS
    ZORTRAX_CALIBRATION_STATUS
    QUERY_PROBE
    M105

[gcode_macro ZORTRAX_HOME_Z]
description = M300 contact HOME Z: automatic nozzle preheat 220C and stable temperature BEFORE PC7 approach
gcode =
    G28 Z

[gcode_macro ZORTRAX_ARM_XY]
description = Operator confirmed >=5mm XY clearance, no movement
gcode =
    ZORTRAX_XY_ARM CLEARANCE=5

[gcode_macro ZORTRAX_HOME_X]
description = M300 native X homing: needs verified XY clearance
